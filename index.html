<title>HUB — всё в одном</title>
<style>
:root{
  --bg:#0b0e14; --bg2:#10141d; --card:#151a26; --card2:#1b2231; --line:#242e42;
  --tx:#e9edf5; --tx2:#8b95a9; --acc:#5b8cff; --acc2:#22d3ee; --ok:#34d399; --bad:#f87171;
  --r:16px; --shadow:0 10px 30px rgba(0,0,0,.35);
}
[data-theme="light"]{
  --bg:#f2f5fb; --bg2:#ffffff; --card:#ffffff; --card2:#eef2f9; --line:#dfe6f2;
  --tx:#182033; --tx2:#5d6779; --shadow:0 10px 26px rgba(30,50,90,.12);
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; background:var(--bg); color:var(--tx); font-size:15px}
button{font:inherit; color:inherit}
#app{display:grid; grid-template-columns:232px 1fr; height:100vh}

/* ---------- SIDEBAR ---------- */
#side{background:var(--bg2); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:16px 12px; gap:6px}
.logo{display:flex; align-items:center; gap:10px; padding:6px 10px 18px}
.logo .lg{width:38px; height:38px; border-radius:12px; background:linear-gradient(135deg,var(--acc),var(--acc2)); display:grid; place-items:center; font-size:20px; box-shadow:var(--shadow)}
.logo b{font-size:20px; letter-spacing:.5px}
.logo span{font-size:11px; color:var(--tx2); display:block; margin-top:1px}
.nitem{display:flex; align-items:center; gap:11px; padding:12px 13px; border-radius:14px; color:var(--tx2); cursor:pointer; border:1px solid transparent; background:none; width:100%; text-align:left}
.nitem .ni{font-size:20px}
.nitem:hover{background:var(--card); color:var(--tx)}
.nitem.on{background:linear-gradient(135deg,rgba(91,140,255,.18),rgba(34,211,238,.12)); border-color:var(--line); color:var(--tx)}
.nitem b{font-weight:500}
.nitem small{display:block; color:var(--tx2); font-size:11px}
.side-foot{margin-top:auto; display:flex; gap:8px}
.sbtn{flex:1; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:9px 6px; cursor:pointer; font-size:16px}
.sbtn:hover{border-color:var(--acc)}

/* ---------- MAIN ---------- */
#main{min-width:0; display:flex; flex-direction:column; overflow:hidden}
.page{flex:1; overflow-y:auto; padding:22px 26px 60px}
.page h1{font-size:24px; margin-bottom:4px}
.page .sub{color:var(--tx2); margin-bottom:20px}
.topline{display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap}
.crumb{background:none; border:1px solid var(--line); background:var(--card); border-radius:12px; padding:8px 13px; cursor:pointer; color:var(--tx2)}
.crumb:hover{color:var(--tx); border-color:var(--acc)}

/* ---------- CARDS / GRIDS ---------- */
.grid{display:grid; gap:14px}
.g-cat{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.g-tpl{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.g-apps{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.cat-card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px; cursor:pointer; display:flex; gap:13px; align-items:center; transition:.15s}
.cat-card:hover{transform:translateY(-2px); border-color:var(--acc); box-shadow:var(--shadow)}
.ictile{width:52px; height:52px; border-radius:16px; display:grid; place-items:center; font-size:26px; flex:none; box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 8px 18px rgba(0,0,0,.28)}
.cat-card .tt b{display:block; margin-bottom:3px}
.cat-card .tt small{color:var(--tx2)}
.badge{margin-left:auto; background:var(--card2); border:1px solid var(--line); color:var(--tx2); border-radius:20px; padding:3px 9px; font-size:12px; flex:none}
.tpl-card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px; display:flex; flex-direction:column; gap:10px}
.tpl-card:hover{border-color:var(--acc)}
.tpl-head{display:flex; gap:11px; align-items:center}
.tpl-head .ictile{width:44px; height:44px; font-size:22px; border-radius:13px}
.tpl-head b{display:block}
.tpl-head small{color:var(--tx2)}
.tpl-desc{color:var(--tx2); font-size:13px; line-height:1.45}
.feats{display:flex; flex-wrap:wrap; gap:6px}
.feat{background:var(--card2); border:1px solid var(--line); border-radius:20px; padding:3px 10px; font-size:12px; color:var(--tx2)}
.tpl-foot{margin-top:auto; display:flex; gap:8px}
.app-card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px; display:flex; flex-direction:column; gap:11px}
.app-card .row{display:flex; gap:10px; align-items:center}
.app-card .grow{flex:1; min-width:0}
.app-card .grow b{display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.app-card .grow small{color:var(--tx2)}
.empty{border:1px dashed var(--line); border-radius:var(--r); padding:34px 20px; text-align:center; color:var(--tx2)}
.empty .big{font-size:38px; margin-bottom:10px}

/* ---------- BUTTONS / INPUTS ---------- */
.btn{background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:9px 14px; cursor:pointer; transition:.15s; white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn.acc{background:linear-gradient(135deg,var(--acc),var(--acc2)); border:none; color:#fff; box-shadow:var(--shadow)}
.btn.danger{color:var(--bad)}
.btn.ghost{background:none}
.btn.sm{padding:6px 11px; font-size:13px; border-radius:10px}
.inp,select.inp,textarea.inp{background:var(--card2); border:1px solid var(--line); color:var(--tx); border-radius:12px; padding:10px 13px; width:100%; outline:none}
.inp:focus{border-color:var(--acc)}
label.fl{display:block; font-size:12px; color:var(--tx2); margin:12px 0 6px}
.chip{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:6px 13px; font-size:13px; cursor:pointer; color:var(--tx2); white-space:nowrap}
.chip:hover{color:var(--tx); border-color:var(--acc)}
.chiprow{display:flex; gap:8px; overflow-x:auto; padding:8px 2px; scrollbar-width:none}

/* ---------- CHAT ---------- */
.chatview{flex:1; display:flex; flex-direction:column; min-height:0; padding:14px 18px 0}
.chat-head{display:flex; align-items:center; gap:10px; padding-bottom:12px; border-bottom:1px solid var(--line); flex-wrap:wrap}
.chat-head h2{font-size:17px; margin-right:auto; display:flex; align-items:center; gap:9px}
.avatar{width:34px; height:34px; border-radius:11px; background:linear-gradient(135deg,var(--acc),var(--acc2)); display:grid; place-items:center; font-size:18px}
select.inp{width:auto; padding:7px 10px; font-size:13px}
.msgs{flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:16px 2px}
.msg{max-width:78%; padding:11px 14px; border-radius:16px; line-height:1.5; word-wrap:break-word}
.msg.user{align-self:flex-end; background:linear-gradient(135deg,var(--acc),var(--acc2)); color:#fff; border-bottom-right-radius:5px}
.msg.agent{align-self:flex-start; background:var(--card); border:1px solid var(--line); border-bottom-left-radius:5px}
.msg.agent ul{margin:6px 0 2px 18px}
.msg.agent li{margin:3px 0}
.msg svg{vertical-align:-3px}
.msg .muted{color:var(--tx2); font-size:12px; margin-top:5px}
.msg.user .muted{color:rgba(255,255,255,.75)}
.tpl-in{background:var(--card2); border:1px solid var(--line); border-radius:13px; padding:11px; margin-top:9px; display:flex; gap:10px; align-items:flex-start}
.tpl-in .ictile{width:40px; height:40px; font-size:20px; border-radius:11px}
.tpl-in b{display:block; font-size:14px}
.tpl-in small{color:var(--tx2); display:block; margin-top:2px}
.acts{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.typing{align-self:flex-start; color:var(--tx2); font-size:13px; padding:8px 12px; background:var(--card); border:1px solid var(--line); border-radius:14px}
.chat-inp{display:flex; gap:9px; padding:12px 0 14px; border-top:1px solid var(--line); align-items:center}
.chat-inp .inp{flex:1; border-radius:16px}
.iconbtn{width:42px; height:42px; flex:none; border-radius:14px; background:var(--card); border:1px solid var(--line); cursor:pointer; font-size:17px}
.iconbtn:hover{border-color:var(--acc)}
.iconbtn.rec{background:var(--bad); border-color:var(--bad); animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.send{width:46px; height:42px; flex:none; border-radius:14px; border:none; cursor:pointer; background:linear-gradient(135deg,var(--acc),var(--acc2)); color:#fff; font-size:17px}

/* ---------- HUB ---------- */
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:18px}
.stat{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:15px}
.stat .v{font-size:26px; font-weight:600; margin:3px 0}
.stat small{color:var(--tx2)}
.hub2{display:grid; grid-template-columns:1.15fr .85fr; gap:16px; margin-bottom:18px}
.panel{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:17px}
.panel h3{font-size:15px; margin-bottom:13px; display:flex; align-items:center; gap:8px}
.bwrap{display:flex; align-items:flex-end; gap:9px; height:110px; margin-top:8px}
.bar{flex:1; background:linear-gradient(180deg,var(--acc),var(--acc2)); border-radius:7px 7px 3px 3px; min-height:4px; position:relative}

/* ---------- APP VIEW ---------- */

.apphead .tt h1{margin:0; font-size:21px}
.apphead .tt small{color:var(--tx2)}
.appbody{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:18px}

/* ---------- MODAL / TOAST ---------- */
#modals{position:fixed; inset:0; display:none; place-items:center; background:rgba(4,7,14,.6); backdrop-filter:blur(4px); z-index:50; padding:16px}

.modal{background:var(--bg2); border:1px solid var(--line); border-radius:20px; width:min(580px,94vw); max-height:88vh; overflow-y:auto; padding:22px; box-shadow:var(--shadow)}

.modal .msub{color:var(--tx2); font-size:13px; margin-bottom:14px}
.prog{height:10px; background:var(--card2); border-radius:20px; overflow:hidden; margin:14px 0}

.pkg-tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; margin:6px 0 12px}

.pkg .pe{font-size:26px}
.pkg b{display:block; margin:6px 0 2px; font-size:13px}
.pkg small{color:var(--tx2); font-size:11px}
.emgrid{display:flex; flex-wrap:wrap; gap:8px}
.em{width:42px; height:42px; border-radius:12px; background:var(--card2); border:1px solid var(--line); cursor:pointer; font-size:20px; display:grid; place-items:center}

.sw{width:32px; height:32px; border-radius:50%; border:2px solid transparent; cursor:pointer}

.check{display:flex; align-items:center; gap:9px; padding:7px 0; cursor:pointer; font-size:14px}
.check input{width:17px; height:17px; accent-color:var(--acc)}
.formgrid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
#toasts{position:fixed; right:16px; bottom:16px; display:flex; flex-direction:column; gap:9px; z-index:60}
.toast{background:var(--card); border:1px solid var(--line); border-left:3px solid var(--acc); border-radius:13px; padding:11px 15px; font-size:14px; box-shadow:var(--shadow); animation:tin .25s}
@keyframes tin{from{transform:translateY(8px); opacity:0}}

/* ---------- RUNTIMES ---------- */
.rt-head{display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap}
.rt-head h3{font-size:16px}
.rt-tag{background:var(--card2); border:1px solid var(--line); border-radius:20px; padding:4px 11px; font-size:12px; color:var(--tx2)}
.pgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px}
.trk{display:flex; gap:10px; align-items:center; padding:9px 11px; border-radius:12px; cursor:pointer; border:1px solid transparent}

.trk .tn b{display:block; font-size:14px}
.trk .tn small{color:var(--tx2)}
.trk .num{color:var(--tx2); font-size:12px; width:18px}
.player{display:flex; gap:16px; align-items:center; margin-bottom:14px; flex-wrap:wrap}
.cover{width:88px; height:88px; border-radius:18px; display:grid; place-items:center; font-size:38px; flex:none; box-shadow:var(--shadow)}
.pctl{display:flex; align-items:center; gap:10px}
.pbig{width:50px; height:50px; border-radius:50%; border:none; cursor:pointer; background:linear-gradient(135deg,var(--acc),var(--acc2)); color:#fff; font-size:19px}
.psm{width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--card2); cursor:pointer; color:var(--tx)}

.todo{display:flex; gap:9px; margin-bottom:13px}

.titem span{flex:1}
.x{background:none; border:none; cursor:pointer; color:var(--tx2); font-size:15px; padding:2px 6px}

.tblwrap{overflow-x:auto}
table.tb{width:100%; border-collapse:collapse; font-size:14px}

.ustat{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-bottom:14px}

.ucard small{color:var(--tx2)}
.palrow{display:flex; gap:10px; flex-wrap:wrap; margin:12px 0}
.palsw{width:92px; height:92px; border-radius:15px; cursor:pointer; position:relative; display:grid; place-items:end center; padding-bottom:8px; color:#fff; font-size:11px; text-shadow:0 1px 3px rgba(0,0,0,.5); box-shadow:var(--shadow)}
.palsw:hover{transform:translateY(-3px)}
.cube-stage{height:250px; display:grid; place-items:center; perspective:700px; margin:10px 0}

@keyframes spin{from{transform:rotateX(-22deg) rotateY(0)}to{transform:rotateX(-22deg) rotateY(360deg)}}
.face{position:absolute; inset:0; border:2px solid; display:grid; place-items:center; font-size:28px}
.rtgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px}
.linkc{background:var(--card2); border:1px solid var(--line); border-radius:13px; padding:12px; cursor:pointer; text-align:center}

.linkc b{display:block; font-size:13px; margin-top:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

.entrow{display:flex; gap:9px; align-items:center; background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:9px 12px; margin-bottom:8px}

.entrow small{color:var(--tx2); display:block}
.vbar{height:9px; background:var(--card2); border-radius:20px; overflow:hidden; margin-top:5px}
.vbar i{display:block; height:100%; background:linear-gradient(90deg,var(--acc),var(--acc2))}
.browserbar{display:flex; gap:9px; margin-bottom:14px}
.bp{min-height:240px}
.newsit{padding:11px 0; border-bottom:1px solid var(--line)}
.newsit b{display:block; margin-bottom:3px}
.newsit small{color:var(--tx2)}
.qopt{display:block; width:100%; text-align:left; background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:11px 14px; margin-bottom:8px; cursor:pointer}
.qopt:hover{border-color:var(--acc)}
.qopt.ok{border-color:var(--ok); background:rgba(52,211,153,.12)}
.qopt.bad{border-color:var(--bad); background:rgba(248,113,113,.12)}
.notecard{background:var(--card2); border:1px solid var(--line); border-radius:13px; padding:13px; margin-bottom:10px}
.notecard b{display:block; margin-bottom:4px}
.notecard p{color:var(--tx2); font-size:13px; line-height:1.5; white-space:pre-wrap}
.lsn p{line-height:1.65; margin:10px 0; color:var(--tx)}
.lsn .code{background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:11px 13px; font-family:ui-monospace,Consolas,monospace; font-size:13px; overflow-x:auto; margin:10px 0}

/* ---------- DIRECTIVES / FILES ---------- */
code{background:var(--card2); border:1px solid var(--line); border-radius:6px; padding:1px 6px; font-size:13px}
.chat-inp{position:relative}
.cmdmenu{position:absolute; bottom:calc(100% + 6px); left:0; right:0; background:var(--bg2); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:6px; display:none; z-index:8; max-height:230px; overflow-y:auto}

.cmdi small{color:var(--tx2); font-size:12px}

.extchip{background:var(--card2); border:1px solid var(--line); border-radius:8px; padding:2px 8px; font-size:12px; font-family:ui-monospace,Consolas,monospace; color:var(--tx2)}
[data-tooltip]{position:relative}
[data-tooltip]:hover::after{content:attr(data-tooltip); position:absolute; bottom:calc(100% + 6px); left:50%; transform:translateX(-50%); background:var(--card); border:1px solid var(--line); color:var(--tx); border-radius:8px; padding:4px 9px; font-size:11px; white-space:nowrap; z-index:99; pointer-events:none; box-shadow:var(--shadow)}

/* ---------- РЕЕСТР / МАСТЕРСКИЕ / СТИЛИ ---------- */
.regrow{display:flex; align-items:center; gap:11px; background:var(--card); border:1px solid var(--line); border-radius:13px; padding:10px 13px; margin-bottom:8px}
.regrow .ri{font-size:22px; width:34px; text-align:center; flex:none}

@media (max-width:760px){.regrow .rmk{display:none}}
.lpill{width:38px; height:38px; border-radius:11px; background:var(--card); border:1px solid var(--line); cursor:pointer; font-weight:500; color:var(--tx)}

.stychips{display:flex; flex-wrap:wrap; gap:8px; max-height:250px; overflow-y:auto}

.stychip i{width:14px; height:14px; border-radius:50%; display:inline-block}
.codeed{font-family:ui-monospace,Consolas,monospace; font-size:13px; line-height:1.6; white-space:pre; overflow-x:auto}
.tvscreen{position:relative; height:210px; border-radius:16px; background:linear-gradient(135deg,#1971c2,#845ef7); display:grid; place-items:center; overflow:hidden}
.tvem{font-size:64px; text-shadow:0 6px 24px rgba(0,0,0,.4)}
.tvlive{position:absolute; top:12px; right:12px; background:rgba(0,0,0,.45); border-radius:8px; padding:3px 9px; font-size:11px; color:#fff; letter-spacing:1px}
.tvtick{position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,.55); color:#fff; font-size:13px; padding:7px 12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sky{position:relative; height:300px; border-radius:16px; overflow:hidden; background:linear-gradient(180deg,#070b24,#141d46 55%,#3a2c50); perspective:600px}
#stars i{position:absolute; width:2px; height:2px; background:#fff; border-radius:50%}
.vehwrap{position:absolute; bottom:64px; left:50%; transform:translate(-50%,0)}
.veh{display:block; line-height:1; will-change:transform}
.flame{display:none; text-align:center; margin-top:-8px; filter:blur(1px); animation:pulse .25s infinite}
.pad{position:absolute; bottom:0; left:0; right:0; height:56px; background:linear-gradient(180deg,#232c44,#0d1020); border-top:2px solid #3a4668}
.count{position:absolute; top:12px; left:0; right:0; text-align:center; font-size:36px; font-weight:600; color:#fff; text-shadow:0 2px 14px rgba(0,0,0,.7)}
.vstage{height:170px; border-radius:16px; display:grid; place-items:center; text-align:center; color:#fff; padding:22px; transition:background .5s; background:var(--card2)}

.calcdisp{background:var(--card2); border:1px solid var(--line); border-radius:14px; padding:16px; font-size:30px; text-align:right; font-family:ui-monospace,Consolas,monospace; margin-bottom:12px; overflow-x:auto; white-space:nowrap}
.calcpad{display:grid; grid-template-columns:repeat(4,1fr); gap:9px}
.calcbtn{background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:13px 0; font-size:17px; cursor:pointer; color:var(--tx)}
.calcbtn:hover{border-color:var(--acc)}
.calcbtn.op{background:rgba(91,140,255,.12)}
.calcbtn.eq{background:linear-gradient(135deg,var(--acc),var(--acc2)); border:none; color:#fff}
.sbprev{background:var(--card2); border:1px solid var(--line); border-radius:16px; padding:16px}
.sbp{max-width:560px; margin:0 auto; border-radius:16px; overflow:hidden; border:1px solid var(--line); max-height:520px; overflow-y:auto}
/* --- галерея полных шаблонов сайтов --- */

.sbm-row{display:flex; gap:5px; padding:6px 7px 4px; flex:1; min-height:0}

.sbm-tag{font-size:9px; opacity:.72; padding:5px 8px; font-family:system-ui,sans-serif; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sbh{background:linear-gradient(135deg,var(--a),#0b7285); color:#fff; padding:34px 18px; text-align:center}
.sbh h2{font-size:22px; margin:0 0 5px}
.sbh span{opacity:.9}
.sbf{display:flex; gap:10px; padding:14px}
.sbf span{flex:1; background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:14px 6px; text-align:center; font-size:13px}
.sbg{display:flex; gap:10px; padding:0 14px 14px}

.sbc{background:var(--card2); border-top:1px solid var(--line); padding:12px; text-align:center; font-size:13px}

/* ---------- ВХОД / 3D-СЦЕНА ---------- */
#login{position:fixed; inset:0; z-index:90; display:grid; place-items:center; background:radial-gradient(1200px 800px at 50% 25%, color-mix(in srgb,var(--acc) 26%,var(--bg)), var(--bg)); transition:opacity .5s, visibility .5s}
#login.off{opacity:0; visibility:hidden}
.lg-box{width:min(370px,92vw); text-align:center; background:color-mix(in srgb,var(--card) 90%,transparent); border:1px solid var(--line); border-radius:24px; padding:26px; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); box-shadow:var(--shadow)}
.lg-box .inp{text-align:center; margin-top:14px}
.lg-box .emgrid{justify-content:center; margin-top:10px}

.stage3d{position:relative; height:260px; border-radius:16px; overflow:hidden; background:linear-gradient(180deg,#0d1230,#1a2350 55%,#232f5c); perspective:600px; touch-action:none}
.stage3d .floor{position:absolute; bottom:0; left:-10%; right:-10%; height:42%; background:linear-gradient(180deg,transparent,#0a0e22); transform:rotateX(55deg); transform-origin:bottom}
.o3dwrap{position:absolute; cursor:grab; touch-action:none}
.o3dwrap:active{cursor:grabbing}
.o3d{width:44px; height:44px; border:2px solid; border-radius:6px}
.cubeO{transform:rotate(12deg) skewY(-8deg)}
.sphereO{border-radius:50%; border:none; box-shadow:inset -6px -8px 14px rgba(0,0,0,.35)}
.pyrO{width:0; height:0; border-left:24px solid transparent; border-right:24px solid transparent; border-bottom:44px solid; background:none!important}
.cylO{border-radius:10px/18px}
.selO{outline:2px solid #fff; outline-offset:3px}

/* ---------- ПРЕМИУМ: aurora, стекло, 3D, анимации ---------- */
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes viewIn{from{opacity:0;transform:translateY(12px) scale(.995)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes auroraA{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,40px) scale(1.15)}}
@keyframes auroraB{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-70px,-30px) scale(.95)}}
@keyframes auroraC{0%,100%{transform:translate(0,0) scale(.95)}50%{transform:translate(40px,-50px) scale(1.2)}}
@keyframes spin3d{from{transform:rotateX(-20deg) rotateY(0)}to{transform:rotateX(-20deg) rotateY(360deg)}}
@keyframes shimmer{from{transform:translateX(-120%)}to{transform:translateX(240%)}}
@keyframes rippleA{to{transform:scale(3.4);opacity:0}}
@keyframes load{from{width:6%}to{width:100%}}

#bgfx{position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden; contain:strict}
#bgfx i{position:absolute; border-radius:50%; opacity:.4; will-change:transform}
#bgfx i:nth-child(1){width:52vw; height:52vw; left:-10vw; top:-14vw; background:radial-gradient(circle, var(--acc) 0%, transparent 68%); animation:auroraA 30s ease-in-out infinite}
#bgfx i:nth-child(2){width:44vw; height:44vw; right:-8vw; top:16vh; background:radial-gradient(circle, var(--acc2) 0%, transparent 68%); animation:auroraB 34s ease-in-out infinite}
#bgfx i:nth-child(3){width:40vw; height:40vw; left:26vw; bottom:-16vw; background:radial-gradient(circle, #a78bfa 0%, transparent 68%); animation:auroraC 40s ease-in-out infinite}
#fxc{position:fixed; inset:0; z-index:-1; pointer-events:none}

#view.enter{animation:viewIn .38s cubic-bezier(.2,.7,.3,1)}
.msg{animation:popIn .28s cubic-bezier(.2,.7,.3,1)}
.modal{background:color-mix(in srgb,var(--card) 94%,transparent); backdrop-filter:blur(18px) saturate(1.2); -webkit-backdrop-filter:blur(18px) saturate(1.2)}
.cat-card,.tpl-card,.app-card,.panel,.stat{background:color-mix(in srgb,var(--card) 74%,transparent)}
#side{background:color-mix(in srgb,var(--bg2) 88%,transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px)}
.cat-card,.tpl-card,.app-card{transition:transform .18s ease, border-color .2s ease; transform-style:preserve-3d}
.cat-card:hover,.tpl-card:hover,.app-card:hover{box-shadow:0 12px 28px rgba(0,0,0,.28)}
.tilt3d{transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.tilt3d .ictile{transform:translateZ(26px)}
.ictile{animation:floaty 5.2s ease-in-out infinite; color:#fff}
.ictile svg{filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
.ni,.mi{display:grid; place-items:center}
.btn svg,.chip svg,.sbtn svg,.lpill svg{vertical-align:-3px}
.nitem.on .ni svg{stroke-width:2}
.cat-card:nth-child(2n) .ictile{animation-delay:.6s}
.cat-card:nth-child(3n) .ictile{animation-delay:1.1s}
.tpl-card:nth-child(2n) .ictile{animation-delay:.8s}
.page h1{background:linear-gradient(120deg,var(--tx) 20%,var(--acc) 60%,var(--acc2)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
.stat .v{background:linear-gradient(120deg,var(--tx),var(--acc)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
.logo .lg{box-shadow:0 6px 22px color-mix(in srgb,var(--acc) 45%,transparent)}
.nitem{transition:.2s}
.nitem:hover{transform:translateX(4px)}
.btn,.chip,.lpill{position:relative; overflow:hidden}
.rip{position:absolute; border-radius:50%; background:rgba(255,255,255,.35); transform:scale(0); animation:rippleA .55s ease-out forwards; pointer-events:none}
.prog i{position:relative; overflow:hidden}
.prog i::after{content:''; position:absolute; inset:0; background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent); animation:shimmer 1.3s linear infinite}
::-webkit-scrollbar{width:9px; height:9px}
::-webkit-scrollbar-thumb{background:var(--card2); border-radius:9px; border:2px solid transparent; background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--line)}

#splash{position:fixed; inset:0; z-index:100; display:grid; place-items:center; background:radial-gradient(1200px 800px at 50% 30%, color-mix(in srgb,var(--acc) 22%,var(--bg)), var(--bg)); transition:opacity .5s, visibility .5s; cursor:pointer}
#splash.off{opacity:0; visibility:hidden}
.sp-cube{width:92px; height:92px; position:relative; transform-style:preserve-3d; animation:spin3d 4.5s linear infinite; margin-bottom:26px}
.sp-cube b{position:absolute; inset:0; display:grid; place-items:center; font-size:34px; background:linear-gradient(135deg, color-mix(in srgb,var(--acc) 88%,transparent), color-mix(in srgb,var(--acc2) 88%,transparent)); border:1px solid rgba(255,255,255,.28); border-radius:18px; color:#fff; box-shadow:0 12px 34px rgba(0,0,0,.35)}
.sp-cube b:nth-child(1){transform:translateZ(46px)}
.sp-cube b:nth-child(2){transform:rotateY(90deg) translateZ(46px)}
.sp-cube b:nth-child(3){transform:rotateY(180deg) translateZ(46px)}
.sp-cube b:nth-child(4){transform:rotateY(-90deg) translateZ(46px)}
.sp-cube b:nth-child(5){transform:rotateX(90deg) translateZ(46px)}
.sp-cube b:nth-child(6){transform:rotateX(-90deg) translateZ(46px)}
.sp-t{font-size:36px; font-weight:600; letter-spacing:7px; background:linear-gradient(120deg,var(--tx),var(--acc2)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; text-align:center}
.sp-s{color:var(--tx2); margin-top:7px; letter-spacing:3px; text-align:center; font-size:12px}
.sp-bar{width:210px; height:4px; border-radius:9px; background:var(--card2); overflow:hidden; margin:22px auto 0}
.sp-bar i{display:block; height:100%; border-radius:9px; background:linear-gradient(90deg,var(--acc),var(--acc2)); animation:load 1.7s ease forwards}
@media (max-width:760px){.cat-card,.tpl-card,.app-card,.panel,.stat{backdrop-filter:none; -webkit-backdrop-filter:none; background:var(--card)}}
@media (prefers-reduced-motion:reduce){
  #bgfx i,.ictile,.sp-cube,.logo .lg,.prog i::after,.sp-bar i{animation:none!important}
  #view.enter,.msg{animation:none!important}
}

/* ---------- ТУР / МОДУЛИ ---------- */
#tourBox{position:fixed; z-index:71; width:min(330px,92vw); background:var(--bg2); border:1px solid var(--acc); border-radius:16px; padding:15px; box-shadow:0 20px 60px rgba(0,0,0,.5); animation:popIn .25s cubic-bezier(.2,.7,.3,1)}
#tourBox b{display:block; margin-bottom:6px; font-size:14px}
#tourBox p{color:var(--tx2); font-size:13px; line-height:1.5; margin:0}
.tour-hl{position:relative; z-index:71; outline:2px solid var(--acc); outline-offset:4px; border-radius:14px; box-shadow:0 0 0 4000px rgba(4,7,14,.5); transition:box-shadow .3s}
.modtab{max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* ---------- ПРЕЗЕНТАЦИИ / ЖИВОЕ ПРЕВЬЮ СБОРКИ ---------- */
.slcanvas{background:var(--card2); border:1px solid var(--line); border-radius:16px; padding:14px}
.slide{aspect-ratio:16/9; border-radius:14px; display:flex; flex-direction:column; justify-content:center; padding:6% 7%; gap:7px; box-shadow:0 14px 34px rgba(0,0,0,.28)}
.slide h2{font-size:clamp(18px,3.2vw,30px); margin:0 0 6px; line-height:1.2}
.slide span{font-size:clamp(12px,1.8vw,17px); opacity:.93}
.slide.big{width:min(860px,100%); margin:0 auto}
/* перетаскивание кнопок Хаба */
.dragq{cursor:grab}
.dragq:active{cursor:grabbing}
.qdrag-over{outline:2px dashed var(--acc); outline-offset:4px; border-radius:14px}
/* живое превью в модале сборки */
#bmPrev{background:var(--card2); border:1px solid var(--line); border-radius:16px; padding:12px; margin-bottom:12px}
#bmPrev .mk{aspect-ratio:16/8.4}
#bmPrev .rt-head{margin-top:4px}
#bmPrevLive{max-height:340px; overflow:auto; border-radius:12px}
/* обучение — путь уроков */
.lpath{display:flex; flex-direction:column; gap:0; align-items:flex-start; padding:6px 0 0 8px}
.lnode{display:flex; gap:14px; align-items:stretch}
.lnode .rail{width:3px; border-radius:2px; background:var(--line); flex:none}
.lnode:last-child .rail{background:transparent}
.lnode .knob{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; margin:8px 0; flex:none; font-weight:800; font-size:16px; border:2px solid var(--line); color:var(--tx2); background:var(--card2)}
.lnode.done .knob{background:var(--acc); border-color:var(--acc); color:#fff}
.lnode.now .knob{border-color:var(--acc); color:var(--acc); box-shadow:0 0 0 5px color-mix(in srgb,var(--acc) 18%,transparent); animation:pulseK 2.2s ease-in-out infinite}
@keyframes pulseK{0%,100%{box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 14%,transparent)}50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--acc) 5%,transparent)}}
.lnode .ltxt{padding:14px 0 14px 4px}
.xpbar{height:9px; border-radius:5px; background:var(--card2); border:1px solid var(--line); overflow:hidden}
.xpbar i{display:block; height:100%; background:linear-gradient(90deg,var(--acc),#22d3ee); border-radius:5px; transition:width .4s}

/* ---------- ИСПОЛНЕНИЯ ПРИЛОЖЕНИЙ (8 стилей) + КОНСТРУКТОР + СТУДИЯ ---------- */
.appmv1 .btn{border-radius:0!important;box-shadow:3px 3px 0 rgba(0,0,0,.4)!important}
.appmv1 .feat,.appmv1 .notecard,.appmv1 .inp{border-radius:0!important}
.appmv1 .rt-head h3{text-transform:uppercase;letter-spacing:.04em}
.appmv2 .notecard,.appmv2 .tpl-card,.appmv2 .panel{background:color-mix(in srgb,var(--acc) 10%,var(--card))!important;border:1px solid color-mix(in srgb,var(--acc) 30%,var(--line))!important;border-radius:18px!important}
.appmv3 .rt-head h3{font-family:Georgia,serif!important}
.appmv3 .btn{border-radius:0!important;background:transparent!important;color:var(--acc)!important;border:1.5px solid var(--acc)!important}
.appmv4 .appbody{background:color-mix(in srgb,#c9a24b 7%,var(--bg))}
.appmv4 .rt-head h3{letter-spacing:.07em;text-transform:uppercase;font-weight:600}
.appmv4 .btn.acc{background:#c9a24b!important;color:#141414!important}
.appmv5 .notecard,.appmv5 .panel,.appmv5 .inp,.appmv5 .btn{border-radius:22px!important}
.appmv6 .appbody{filter:sepia(.25)}
.appmv6 .rt-head h3{font-family:"Courier New",monospace!important;text-transform:uppercase}
.appmv7 .appbody{filter:grayscale(1)}
.appmv7 .rt-head h3{text-transform:uppercase;font-weight:900}
/* полноэкранный конструктор */
#app.focus #side,#app.focus #mnav{display:none!important}
#app.focus{grid-template-columns:1fr}
.btop{display:flex;gap:9px;align-items:center;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.bwrap3{display:grid;grid-template-columns:215px 1fr 245px;gap:12px;padding:12px;align-items:start}
.bwrap3 .panel{margin:0;position:sticky;top:64px;max-height:calc(100vh - 76px);overflow-y:auto}
.bpl{display:flex;flex-direction:column;gap:5px}
.bpl button{display:flex;gap:7px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:7px 9px;cursor:pointer;color:var(--tx);font-size:12px;text-align:left}
.bpl button:hover{border-color:var(--acc)}
.bprop{display:flex;flex-direction:column;gap:8px}
.bprop label.fl{margin:0}
.bprop .inp{width:100%}
.bgrid{display:grid;gap:12px;grid-template-columns:1fr;padding:14px;max-width:980px;margin:0 auto}
.bgrid.two{grid-template-columns:1fr 1fr}
.bkcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;position:relative}
.bkcard.dragging{opacity:.4}
.bkcard .bkhand{position:absolute;top:6px;left:8px;cursor:grab;color:var(--tx2);font-size:13px;line-height:1}
.bkcard .bktools{position:absolute;top:5px;right:8px;display:flex;gap:4px;opacity:.25;transition:.15s;z-index:2}
.bkcard:hover .bktools{opacity:1}
.bkcard .bktools button{background:none;border:none;cursor:pointer;color:var(--tx2);font-size:13px;padding:2px 4px}
.bkcard .bktools button:hover{color:var(--acc)}
.bkcard h4{margin:2px 0 8px;font-size:12px;color:var(--tx2);font-weight:600;padding-left:20px}
.blend{border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--tx2);font-size:13px}
.blib{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.blib .tpl-card{cursor:pointer;padding:10px}
.blib .tpl-card:hover{border-color:var(--acc)}
/* студия — IDE */
.ide{display:grid;grid-template-columns:200px 1fr 280px;gap:8px;height:calc(100vh - 120px);min-height:420px}
.ide-side{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;overflow-y:auto}
.ide-side h5{margin:2px 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--tx2)}
.ide-tree{font-size:12.5px;line-height:1.9}
.ide-tree .dir{cursor:pointer;color:var(--tx);font-weight:600}
.ide-tree .file{cursor:pointer;color:var(--tx2);padding-left:16px;display:block;width:100%;text-align:left;background:none;border:none;font-size:12.5px}
.ide-tree .file:hover{color:var(--acc)}
.ide-tree .file.on{color:var(--acc);font-weight:700}
.ide-side .tools{display:flex;gap:5px;margin-top:8px}
.ide-main{display:flex;flex-direction:column;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ide-tabs{display:flex;gap:2px;background:var(--bg2);padding:4px 6px 0;overflow-x:auto}
.ide-tabs .tab{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px 8px 0 0;font-size:12px;cursor:pointer;color:var(--tx2);white-space:nowrap}
.ide-tabs .tab.on{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-bottom:none}
.ide-tabs .tab i{font-style:normal;opacity:.5}
.ide-ed{flex:1;display:flex;min-height:0;background:var(--bg)}
.ide-num{padding:10px 6px;color:var(--tx2);font:12px/1.6 ui-monospace,Consolas,monospace;text-align:right;user-select:none;overflow:hidden;opacity:.6}
.ide-ed textarea{flex:1;background:transparent;border:none;outline:none;resize:none;color:var(--tx);font:12.5px/1.6 ui-monospace,Consolas,monospace;padding:10px 12px 10px 4px;white-space:pre;overflow:auto}
.ide-sqlbar{padding:8px 12px;background:var(--bg2);border-top:1px solid var(--line)}
.ide-sqlbar .sqlres{margin-top:8px;max-height:200px;overflow:auto}
.ide-status{display:flex;gap:14px;padding:5px 12px;font-size:11px;color:var(--tx2);background:var(--bg2);border-top:1px solid var(--line)}
.ide-chat{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ide-chat h5{margin:0;padding:8px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--tx2);background:var(--bg2);display:flex;justify-content:space-between;align-items:center}
.ide-chatlog{flex:1;overflow-y:auto;padding:10px;font-size:12.5px;line-height:1.6;display:flex;flex-direction:column;gap:8px}
.ide-chatlog .me{align-self:flex-end;background:color-mix(in srgb,var(--acc) 22%,transparent);padding:6px 10px;border-radius:10px 10px 2px 10px;max-width:92%}
.ide-chatlog .bot{align-self:flex-start;background:var(--card2);padding:6px 10px;border-radius:10px 10px 10px 2px;max-width:96%;color:var(--tx)}
.ide-chatlog .bot small{color:var(--tx2)}
.ide-chatin{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}
@media(max-width:900px){.ide{grid-template-columns:1fr 240px;height:auto}.ide-side{display:none}}
/* студия */
.studio{display:flex;flex-direction:column;height:calc(100vh - 30px)}
.stlog{flex:1;overflow-y:auto;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;line-height:1.65;padding:14px;background:var(--bg);border:1px solid var(--line);border-radius:14px 14px 0 0;white-space:pre-wrap}
.stlog .in{color:var(--acc);font-weight:700}
.stlog .ok{color:var(--ok)}
.stlog .hint{color:var(--tx2)}
.stin{display:flex;gap:8px;padding:10px 0}
.stin .inp{font-family:ui-monospace,monospace}
.stsug{position:absolute;bottom:64px;left:14px;right:14px;background:var(--card);border:1px solid var(--acc);border-radius:12px;z-index:6;overflow:hidden}
.stsug div{padding:7px 12px;cursor:pointer;font-size:13px}
.stsug div:hover{background:color-mix(in srgb,var(--acc) 15%,transparent)}

/* ---------- МИНИ-ПРЕВЬЮ ПРИЛОЖЕНИЙ (mk) — визуальное окошко вместо текста ---------- */
.mk{position:relative; aspect-ratio:16/9; border-radius:12px; overflow:hidden; flex:none;
  background:linear-gradient(140deg,var(--g1,#232a3d),var(--g2,#141826)); border:1px solid var(--line);
  display:flex; flex-direction:column; box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 6px 16px rgba(0,0,0,.22)}
.mk::after{content:''; position:absolute; inset:0; background:linear-gradient(165deg,rgba(255,255,255,.1),transparent 45%); pointer-events:none}
.mk-top{height:13px; flex:none; display:flex; align-items:center; gap:3.5px; padding:0 8px; background:rgba(0,0,0,.22); border-bottom:1px solid rgba(255,255,255,.07)}
.mk-top i{width:4.5px; height:4.5px; border-radius:50%; background:rgba(255,255,255,.28)}
.mk-top i:first-child{background:var(--acc)}
.mk-b{flex:1; display:flex; min-height:0; padding:7px; gap:6px}
.mln{display:block; height:4.5px; border-radius:3px; background:rgba(255,255,255,.15); min-width:0}
.mln.soft{background:rgba(255,255,255,.09)}
.macc{background:var(--acc)!important}
.mcard{background:rgba(255,255,255,.09); border-radius:7px; padding:6px; display:flex; flex-direction:column; gap:4px; min-width:0}
.mrow{display:flex; align-items:center; gap:5px; min-width:0}
.mcol{display:flex; flex-direction:column; gap:5px; flex:1; min-width:0; justify-content:space-between}
.mgrid{display:grid; gap:5px; flex:1; min-width:0}
.mdot{width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.3); flex:none}
.mdot.macc{background:var(--acc)}
.mpill{height:9px; border-radius:5px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.12); flex:1}
.mpill.macc{background:color-mix(in srgb,var(--acc) 30%,transparent); border-color:var(--acc)}
.mbar{width:7px; border-radius:3px 3px 0 0; background:rgba(255,255,255,.18); align-self:flex-end}
.mbar.macc{background:var(--acc)}
.msw{flex:1; border-radius:4px; min-height:100%}
.mkey{border-radius:4px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.08)}
.mkey.macc{background:var(--acc); border-color:transparent}
.mbub{max-width:62%; padding:4px 7px; border-radius:8px 8px 8px 3px; background:rgba(255,255,255,.1); display:flex; flex-direction:column; gap:3px}
.mbub.me{margin-left:auto; border-radius:8px 8px 3px 8px; background:color-mix(in srgb,var(--acc) 34%,transparent)}

/* ---------- MOBILE ---------- */
#mnav{display:none}
@media (max-width:760px){
  #app{grid-template-columns:1fr}
  #side{display:none}
  #mnav{display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--bg2); border-top:1px solid var(--line); z-index:40; padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  #mnav button{flex:1; background:none; border:none; color:var(--tx2); font-size:11px; padding:5px 0; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px}
  #mnav button .mi{font-size:20px}
  #mnav button.on{color:var(--acc)}
  .page{padding:16px 14px 90px}
  .hub2{grid-template-columns:1fr}
  .msg{max-width:88%}
  .chatview{padding:10px 10px calc(76px + env(safe-area-inset-bottom))}
  #mnav button{min-width:0; overflow:hidden}
  #mnav button .ml{display:block; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  #mnav button[data-drag]{display:none}
}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="logo"><div class="lg"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg></div><div><b>HUB</b><span>всё в одном</span></div></div>

const ORIG=new Map();
function trDOM(root,skip){
  const L=S.settings.lang; const D=(L!=='ru'&&DICT[L])?DICT[L]:null; if(!root)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement; return p&&skip&&p.closest(skip)?NodeFilter.FILTER_REJECT:(n.nodeValue.trim()?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT);}});
  const ns=[]; while(w.nextNode())ns.push(w.currentNode);
  if(!D){ for(const n of ns){ if(ORIG.has(n))n.nodeValue=ORIG.get(n); }
    root.querySelectorAll('[placeholder],[data-tooltip]').forEach(el=>{ if(ORIG.has(el)){el.setAttribute('placeholder',ORIG.get(el)); el.setAttribute('data-tooltip',ORIG.get(el));} });
    return; }
  for(const n of ns){ const t=n.nodeValue.trim(); if(!t)continue;
    if(!ORIG.has(n))ORIG.set(n,n.nodeValue);
    let key=t.replace(/^[^\p{L}\p{N}(«]+/u,''), v=D[key];
    if(v===undefined){for(const k in D){if(k.length>=3&&t.startsWith(k)&&/^$|[\s,!.…):]/.test(t.slice(k.length,k.length+1))){v=D[k]; key=k; break;}}}
    if(v===undefined)v=D[t];
    if(v!==undefined)n.nodeValue=n.nodeValue.replace(key,v);}
  root.querySelectorAll('[placeholder],[data-tooltip]').forEach(el=>{['placeholder','data-tooltip'].forEach(a=>{const v=el.getAttribute(a); if(!v)return; if(!ORIG.has(el))ORIG.set(el,v); const t=D[v.trim()]; if(t!==undefined)el.setAttribute(a,t);});});
}

 if(String(content).startsWith('data:'))a.href=content;

  if(!from||from===to)return;

  const arr=dom.filter((v,i)=>dom.indexOf(v)===i);

  const dom=[...document.querySelectorAll('[data-drag]')].map(x=>x.dataset.drag).filter((v,i2,a)=>a.indexOf(v)===i2);

function ideVFSsql(){
  const {files}=ideVFS(); const {dirs}=ideVFS();
  if(!dirs.includes('База'))dirs.push('База');
  if(!files['База/схема.sql'])files['База/схема.sql']={c:'CREATE TABLE users (name TEXT, age INTEGER, city TEXT);\nINSERT INTO users VALUES ("Аня", 20, "Москва");\nINSERT INTO users VALUES ("Борис", 35, "Казань");\nINSERT INTO users VALUES ("Вика", 17, "Омск");\nSELECT name, age FROM users WHERE age >= 18 ORDER BY age DESC;\n',lang:'sql'};
  return S.vfs;
}
function sqlExec(q){
  const db=S.vfs.db=S.vfs.db||{tables:{}};
  const out=[];
  const clean=q.replace(/--[^\n]*/g,'');
  clean.split(';').map(x=>x.trim()).filter(Boolean).forEach(stmt=>{
    const U=stmt.toUpperCase();
    try{
    if(U.startsWith('CREATE TABLE')){
      const m=stmt.match(/CREATE\s+TABLE\s+(\w+)\s*\((.+)\)/is);
      if(!m)throw new Error('Понял CREATE TABLE, но не разобрал колонки');
      const cols=m[2].split(',').map(c=>c.trim().split(/\s+/)[0]);
      db.tables[m[1].toLowerCase()]={cols,rows:[]}; out.push({t:'ok',msg:'Таблица '+m[1]+' создана: '+cols.join(', ')});
    } else if(U.startsWith('INSERT INTO')){
      const m=stmt.match(/INSERT\s+INTO\s+(\w+)\s*(?:\(([^)]+)\))?\s*VALUES\s*\((.+)\)/is);
      if(!m)throw new Error('INSERT не разобрал');
      const tb=db.tables[m[1].toLowerCase()]; if(!tb)throw new Error('Нет таблицы '+m[1]);
      const vals=m[3].split(',').map(v=>v.trim().replace(/^'|'$/g,'').replace(/^"|"$/g,''));
      const row=tb.cols.map((c,i)=>vals[i]!==undefined?vals[i]:(m[2]?null:'—'));
      tb.rows.push(row); out.push({t:'ok',msg:'Добавлена строка в '+m[1]});
    } else if(U.startsWith('SELECT')){
      const m=stmt.match(/SELECT\s+(.+?)\s+FROM\s+(\w+)(?:\s+WHERE\s+(.+?))?(?:\s+ORDER\s+BY\s+(\w+)(\s+DESC)?)?(?:\s+LIMIT\s+(\d+))?$/is);
      if(!m)throw new Error('SELECT не разобрал (поддержка: WHERE col = value, ORDER BY, LIMIT)');
      const tb=db.tables[m[2].toLowerCase()]; if(!tb)throw new Error('Нет таблицы '+m[2]);
      let rows=tb.rows.map(r=>r.slice());
      const ci=c=>tb.cols.findIndex(x=>x.toLowerCase()===c.toLowerCase());
      if(m[3]){const wm=m[3].match(/(\w+)\s*(>=|<=|!=|=|>|<)\s*'?([^']+)'?/); if(wm){const i=ci(wm[1]); if(i<0)throw new Error('Нет колонки '+wm[1]);
        rows=rows.filter(r=>{const a=r[i],b=wm[3]; const na=parseFloat(a),nb=parseFloat(b);
          switch(wm[2]){case '=':return String(a)===String(b); case '>':return na>nb||(!isNaN(na)&&isNaN(nb)&&String(a)>b); case '<':return na<nb||(!isNaN(na)&&isNaN(nb)&&String(a)<b); case '>=':return na>=nb; case '<=':return na<=nb; case '!=':return String(a)!==String(b);} return false;});}}
      if(m[4]){const i=ci(m[4]); if(i>=0)rows.sort((x,y)=>String(x[i]).localeCompare(String(y[i]),'ru')*(m[5]?-1:1));}
      if(m[6])rows=rows.slice(0,+m[6]);
      let cols=tb.cols;
      if(m[1].trim()!=='*')cols=m[1].split(',').map(c=>c.trim());
      const idx=cols.map(c=>ci(c));
      out.push({t:'table',cols,rows:rows.map(r=>idx.map(i=>i>=0?r[i]:'?'))});
    } else if(U.startsWith('DROP TABLE')){
      const m=stmt.match(/DROP\s+TABLE\s+(\w+)/i); delete db.tables[m[1].toLowerCase()]; out.push({t:'ok',msg:'Таблица удалена'});
    } else if(U.startsWith('SHOW TABLES')){out.push({t:'ok',msg:'Таблицы: '+Object.keys(db.tables).join(', ')||'нет'});}
    else throw new Error('Не понял запрос. Поддержка: CREATE TABLE, INSERT INTO, SELECT (WHERE/ORDER BY/LIMIT), DROP TABLE, SHOW TABLES');
    }catch(e){out.push({t:'err',msg:e.message});}
  });
  return out;
}
function sqlRun(q,res){
  const rows=sqlExec(q); if(!rows.length){res.innerHTML=''; return;}
  res.innerHTML=rows.map(r=>r.t==='table'
    ?`<div class="tblwrap" style="margin-top:8px"><table class="tb"><thead><tr>${r.cols.map(c=>'<th>'+esc(c)+'</th>').join('')}</tr></thead><tbody>${r.rows.map(x=>'<tr>'+x.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')||'<tr><td style="color:var(--tx2)">0 строк</td></tr>'}</tbody></table></div>`
    :`<div style="color:${r.t==='ok'?'var(--ok)':'var(--bad)'};font-size:12.5px;padding:4px 0">${esc(r.msg)}</div>`).join('');
  save();
}

function stExec(raw){
  const say=(h,c)=>stOut('<span class="in">hub&gt; '+esc(raw)+'</span>',c), rep=h=>stOut(h);
  say('');
  if(stPending){if(/^(да|y|yes|да)/.test(stNorm(raw))){const c=stPending; stPending=null; return stDo(c.c,raw,c.arg);}
    stPending=null; rep('<span class="hint">Ок, не выполняю. Уточни команду — help покажет список.</span>'); return;}
  const nrm=stNorm(raw);
  if(/^создай файл|^новый файл|^new file/.test(nrm))return stDo('newfile',raw.slice(nrm.indexOf('файл')+4).trim()||'');
  if(/^открой файл|^open file/.test(nrm))return stDo('openfile',raw.slice(nrm.indexOf('файл')+4).trim());
  if(/^удали файл/.test(nrm))return stDo('rmfile',raw.slice(nrm.indexOf('файл')+4).trim());
  const parts=stNorm(raw).split(' ');
  let head=parts[0], arg=raw.slice(raw.toLowerCase().indexOf(parts[0])+parts[0].length).trim();
  let cmd=STCMDS.find(c=>c.syn.includes(head)||c.c===head);
  if(!cmd&&head.length>=3){
    let best=null,bd=99;
    STCMDS.forEach(c=>c.syn.forEach(sn=>{const d=lev(head,sn); if(d<bd){bd=d;best=c;}}));
    if(bd<=1)cmd=best;
    else if(bd<=2){stPending={c:best,arg}; rep(`Не понял «${esc(head)}». Имел в виду <b>${best.c}</b> ${best.d}? Напиши <b>да</b> — выполню, или переформулируй.`); return;}
  }
  if(!cmd){rep(`<span class="hint">Свободный текст — отдаю агенту чата…</span>`);
    if(S.settings.ai&&S.settings.ai.key){
      rep('<span class="hint">ИИ думает…</span>');
      aiChat(raw).then(r=>{stOut(esc(r||'')||'<span class="hint">ИИ не ответил</span>');}).catch(()=>rep('<span class="hint">ИИ недоступен. Команды: help</span>'));
    } else rep(`<span class="hint">Не нашёл команду «${esc(head)}». Похожее:</span>`+
      STCMDS.slice(0,6).map(c=>`<div>· <b>${c.c}</b> ${c.a||''} — ${c.d}</div>`).join('')+`<div class="hint">Подключи ИИ-ключ в Настройках — тогда я пойму любой текст. help — команды.</div>`);
    return;}
  stDo(cmd.c,arg,raw);
}
function stDo(c,arg,raw){
  const rep=h=>stOut(h);
  switch(c){
    case 'help':rep('<b>Команды Студии</b> (опечатки пойму):'+STCMDS.map(x=>`<div>· <b>${x.c}</b> ${x.a||''} — ${x.d}</div>`).join('')); break;
    case 'apps':rep(S.apps.length?S.apps.map(a=>`<div>· ${a.icon||'📦'} <b>${esc(a.name)}</b> — ${(catById(a.cat)||{name:''}).name}</div>`).join(''):'Пока пусто. create <имя> — создам.'); break;
    case 'create':{if(!arg){rep('Формат: create <имя и идея>. Пример: create трекер воды'); break;}
      const idea=arg;
      const pool=TPL.filter(t=>t.cat!=='apps'&&t.cat!=='agents'&&t.rt!=='admin');
      const q=stNorm(idea);
      const t=pool.find(x=>stNorm(x.name).split(/[\s-]+/).some(w=>w.length>2&&q.includes(w)))
        ||pool.find(x=>(CAT_FEATS[x.cat]||[]).some(f=>q.includes(stNorm(f).slice(0,5))&&stNorm(f).length>3))
        ||null;
      if(t){buildFromTemplate(t.id,arg.slice(0,34));
        rep(`Собираю <b>${esc(arg.slice(0,34))}</b> — шаблон «${esc(t.name)}». Дальше конструктор: добавляй блоки, тянуй, настраивай.`); break;}
      const nb={id:uid(),name:uname(arg.slice(0,34)),icon:'🧩',cat:'apps',tpl:null,rt:'builder',feats:['Конструктор','Блоки','Свои кнопки'],created:Date.now(),data:{layout:[{id:'main',t:'main',cfg:{}}],b:{}}};
      S.apps.unshift(nb); bump('apps'); save();
      rep(`Собираю <b>${esc(nb.name)}</b> с нуля — конструктор открыт: «＋ Блок» добавит детали.`);
      setTimeout(()=>{closeModal(); navTo('build:'+nb.id);},400); break;}
    case 'open':case 'edit':{if(!arg){rep('Формат: '+c+' <имя>'); break;}
      let a=S.apps.find(x=>stNorm(x.name)===stNorm(arg)||stNorm(x.name).includes(stNorm(arg)));
      if(!a)a=S.apps.find(x=>lev(stNorm(x.name),stNorm(arg))<=2);
      if(!a){rep('Не нашёл приложение «'+esc(arg)+'». apps — список.'); break;}
      rep('Открываю «'+esc(a.name)+'»'+(c==='edit'?' в конструкторе':'')+'…');
      setTimeout(()=>navTo(c==='edit'?'build:'+a.id:'app:'+a.id),350); break;}
    case 'delete':{const a=S.apps.find(x=>stNorm(x.name).includes(stNorm(arg))||lev(stNorm(x.name),stNorm(arg))<=2);
      if(!a){rep('Не нашёл. apps — список.'); break;}
      S.apps=S.apps.filter(x=>x.id!==a.id); save(); rep('Удалил «'+esc(a.name)+'» 🗑'); break;}
    case 'workshop':rep('🛠️ Мастерская…'); setTimeout(()=>navTo('workshop'),350); break;
    case 'learn':rep('🎓 Обучение…'); setTimeout(()=>navTo('learn'),350); break;
    case 'catalog':rep('🧭 Каталог…'); setTimeout(()=>navTo('catalog'),350); break;
    case 'site':{let sa=S.apps.find(x=>x.rt==='site');
      if(!sa){sa={id:uid(),name:uname('Мой сайт'),icon:'🧱',cat:'work',tpl:'sitebuilder',rt:'site',feats:[],created:Date.now(),data:{}}; S.apps.unshift(sa); save();}
      rep('🧱 Сайт-конструктор — 2000 полных шаблонов.'); setTimeout(()=>navTo('app:'+sa.id),350); break;}
    case 'theme':{if(/dark|темн/.test(stNorm(arg)))S.settings.theme='dark';
      else if(/light|светл/.test(stNorm(arg)))S.settings.theme='light';
      else if(/^#[0-9a-f]{6}$/.test(stNorm(arg)))S.settings.accent=stNorm(arg);
      else {rep('Формат: theme dark · light · #a78bfa'); break;}
      applyTheme(); save(); rep('Тема применена: '+esc(stNorm(arg))); break;}
    case 'style':{const n=Math.max(0,Math.min(7,+arg||0)); const a=S.apps[0];
      if(!a){rep('Нет приложений — style не к чему.'); break;}
      a.smv=n; save(); rep('Стиль «'+APP_MV[n]+'» → «'+esc(a.name)+'». Открою — увидишь.'); setTimeout(()=>navTo('app:'+a.id),350); break;}
    case 'stats':rep(`📊 Приложений: <b>${S.apps.length}</b> · сообщений: <b>${S.stats.msgs}</b> · файлов: <b>${S.files.length}</b> · XP: <b>${S.learn.xp}</b>`); break;
    case 'backup':dl('hub-backup-'+dayKey(new Date())+'.json',JSON.stringify(S)); rep('Бэкап скачан ⬇'); break;
    case 'search':if(!arg){rep('Формат: search <что>'); break;} closeModal(); openSearch(arg); break;
    case 'tour':startTour(0); rep('Тур запущен 🚀'); break;
    case 'newfile':{if(!arg){rep('Формат: newfile <путь/имя> (например: Код/app.js)'); break;}
      const {files}=ideVFS(); if(files[arg]!==undefined){rep('Файл уже есть — открыл.'); ideOpen(arg); break;}
      files[arg]={c:'',lang:arg.split('.').pop()}; save(); ideTree(); ideOpen(arg);
      rep('Файл <b>'+esc(arg)+'</b> создан и открыт в редакторе.'); break;}
    case 'openfile':{if(!arg){rep('Формат: openfile <путь>'); break;}
      const {files:fs2}=ideVFS(); const hit=Object.keys(fs2).find(x=>x.includes(arg));
      if(!hit){rep('Не нашёл файл. Дерево слева — что есть.'); break;}
      ideOpen(hit); rep('Открыл <b>'+esc(hit)+'</b>.'); break;}
    case 'rmfile':{const {files:fs3}=ideVFS(); const hit2=Object.keys(fs3).find(x=>x.includes(arg));
      if(!hit2){rep('Не нашёл файл.'); break;} delete fs3[hit2]; save(); ideTree(); ideClose(hit2); rep('Удалил файл <b>'+esc(hit2)+'</b>.'); break;}
    case 'clear':S.studio.log=[]; save(); paintStLog(); break;
    default:rep('Не реализовал — help.');
  }
}

function afterChat(){
  const msgs=$('#msgs');
  if(!S.msgs.length){
    S.msgs.push({role:'agent',agent:'',html:welcomeHTML()});
  }
  S.msgs.forEach(m=>msgs.append(msgEl(m)));
  msgs.scrollTop=msgs.scrollHeight;
  $('#personaSel').onchange=e=>{S.curAgent=e.target.value; const p=persona();
    if(p.id)pushMsg('agent',`${esc(p.greeting||'Привет! Я '+p.name+'.')} <span class="muted">Навыки: ${esc(p.skills.join(', '))||'общие'}</span>`);
    save(); renderChatHead();};
  $('#sendBtn').onclick=sendChat;
  const ci=$('#chatInp');
  ci.onkeydown=e=>{if(e.key==='Enter')sendChat(); if(e.key==='Escape')hideCmd();};
  ci.oninput=()=>{const v=ci.value;
    if(v.startsWith('/')&&!v.includes(' '))showCmd(DIRECTIVES.filter(d=>d.c.startsWith(v.toLowerCase())));
    else hideCmd();};
  $('#ttsBtn').onclick=()=>{S.settings.tts=!S.settings.tts; save(); renderChatHead(); toast(S.settings.tts?'Голос агента включён 🔊':'Голос агента выключен 🔈');};
  $('#vsetBtn').onclick=()=>navTo('settings');
  $('#callBtn').onclick=toggleCall;
  if(callMode){const b=$('#callBtn'); if(b)b.classList.add('rec');}
  $('#micBtn').onclick=toggleMic;
}
function renderChatHead(){const v=$('#view'); if(route==='chat'){v.innerHTML=chatHTML(); afterChat();}}
function msgEl(m){const d=document.createElement('div'); d.className='msg '+m.role; d.innerHTML=m.html; return d;}
function pushMsg(role,html,plain){
  const m={role,html}; S.msgs.push(m); S.stats.msgs++;
  const msgs=$('#msgs');
  if(msgs){const el=msgEl(m); msgs.append(el); msgs.scrollTop=msgs.scrollHeight;}
  save();
  if(role==='agent'&&(S.settings.tts||callMode)&&plain!==false)speak(html);
  return m;
}
function speak(html){try{const t=document.createElement('div'); t.innerHTML=html;
  const u=new SpeechSynthesisUtterance(t.textContent.slice(0,300)); u.lang='ru-RU';
  const cfg=S.settings.v||{}; u.rate=cfg.rate||1; u.pitch=cfg.pitch||1; u.volume=cfg.volume==null?1:cfg.volume;
  if(cfg.name){const vv=speechSynthesis.getVoices().find(x=>x.name===cfg.name); if(vv)u.voice=vv;}
  speechSynthesis.cancel(); speechSynthesis.speak(u);}catch(e){}}
function sendChat(){
  const inp=$('#chatInp'); const text=inp.value.trim(); if(!text)return; inp.value='';
  hideCmd();
  let t=text;
  if(/^директива\s+/i.test(t))t=t.replace(/^директива\s+/i,'/');
  if(S.consent!==false){S.training=S.training||[]; S.training.push({t,d:Date.now()}); if(S.training.length>300)S.training.shift();}
  if(t.startsWith('/')){pushMsg('user',esc(t)); runDirective(t); return;}
  pushMsg('user',esc(t).replace(/\n/g,'<br>'));
  const tp=document.createElement('div'); tp.className='typing'; tp.textContent=(S.settings.ai.key?'ИИ думает…':'Хаб печатает…'); $('#msgs').append(tp);
  $('#msgs').scrollTop=1e9;
  if(S.settings.ai&&S.settings.ai.key){
    aiChat(t).then(rep=>{tp.remove(); if(rep)pushMsg('agent',fmtAI(rep)); else agentReply(t);})
      .catch(()=>{tp.remove(); toast('ИИ недоступен — отвечаю встроенными правилами'); agentReply(t);});
    return;
  }
  setTimeout(()=>{tp.remove(); agentReply(t);},500+rnd(400));
}
async function aiChat(text){
  const ai=S.settings.ai;
  const sys=(S.sys.prompt||'')+' Ты — Хаб, дружелюбный ассистент платформы HUB (одно приложение: приложения, файлы, стили, агенты, упаковка). Отвечай кратко, по делу, на языке пользователя.';
  const hist=S.msgs.slice(-12).map(m=>({role:m.role==='user'?'user':'assistant',content:m.html.replace(/<[^>]+>/g,' ').trim().slice(0,400)})).filter(m=>m.content);
  const r=await fetch(ai.url||'https://api.openai.com/v1/chat/completions',{method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+ai.key},
    body:JSON.stringify({model:ai.model||'gpt-4o-mini',max_tokens:700,
      messages:[{role:'system',content:sys},...hist,{role:'user',content:text}]})});
  const j=await r.json();
  if(j.error)throw new Error(j.error.message||'AI error');
  return j.choices&&j.choices[0]?j.choices[0].message.content:null;
}
function fmtAI(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\n/g,'<br>');}
function hideCmd(){const m=$('#cmdMenu'); if(m)m.classList.remove('on');}
function showCmd(hits){
  const m=$('#cmdMenu'); if(!m)return;
  if(!hits.length){m.classList.remove('on'); return;}
  m.innerHTML=hits.map(d=>`<div class="cmdi" data-c="${d.c}"><b>${d.c}</b><small>${d.a?d.a+' · ':''}${d.d}</small></div>`).join('');
  m.classList.add('on');
  $$('#cmdMenu .cmdi').forEach(i=>i.onclick=()=>{const ci=$('#chatInp'); ci.value=i.dataset.c+' '; m.classList.remove('on'); ci.focus();});
}
function chatAction(c){$('#chatInp').value=c; sendChat();}

let rec=null;
let callMode=false, callRec=null;
function toggleCall(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(callMode){callMode=false; try{callRec&&callRec.stop();}catch(e){} const b=$('#callBtn'); if(b)b.classList.remove('rec'); try{speechSynthesis.cancel();}catch(e){} toast('Режим разговора выключен'); return;}
  if(!SR){toast('Режим разговора работает в Chrome'); return;}
  callMode=true; const b=$('#callBtn'); if(b)b.classList.add('rec');
  toast('Режим разговора включён — просто говори 🎙'); startCallRec();
}
function startCallRec(){
  if(!callMode)return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  callRec=new SR(); callRec.lang='ru-RU'; callRec.interimResults=false; callRec.continuous=false;
  callRec.onresult=e=>{const v=e.results[0][0].transcript; if(!$('#chatInp')){callMode=false;return;}
    pushMsg('user',esc(v));
    const tp=document.createElement('div'); tp.className='typing'; tp.textContent='Хаб слушает и думает…'; const box=$('#msgs'); if(box){box.append(tp); box.scrollTop=1e9;}
    setTimeout(()=>{tp.remove(); agentReply(v); waitSpeech();},450);};
  callRec.onend=()=>{if(callMode&&!speechSynthesis.speaking)try{startCallRec();}catch(e){}};
  callRec.onerror=()=>{if(callMode)setTimeout(()=>{try{startCallRec();}catch(e){}},700);};
  try{callRec.start();}catch(e){}
}
function waitSpeech(){
  const iv=setInterval(()=>{ if(!speechSynthesis.speaking){clearInterval(iv); if(callMode)try{startCallRec();}catch(e){}}},300);
  setTimeout(()=>clearInterval(iv),20000);
}
function toggleMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('Голосовой ввод не поддерживается этим браузером — работает в Chrome'); return;}
  if(rec){rec.stop(); return;}
  rec=new SR(); rec.lang='ru-RU'; rec.interimResults=false;
  rec.onresult=e=>{const v=e.results[0][0].transcript; const i=$('#chatInp'); if(i){i.value=v; sendChat();}};
  rec.onend=()=>{rec=null; const b=$('#micBtn'); if(b)b.classList.remove('rec');};
  rec.onerror=()=>{toast('Не расслышал — попробуй ещё раз');};
  rec.start(); const b=$('#micBtn'); if(b)b.classList.add('rec'); toast('Слушаю… 🎙️');
}

function openSearch(q){
  modal(`<h2>🔍 Поиск по всему HUB</h2><div class="msub">Приложения · шаблоны · обучение · реестр «А-Я · A-Z» — всё отсюда</div>
  <input class="inp" id="gq" placeholder="Набери хотя бы 2 буквы…" autocomplete="off" value="${esc(q||'')}">
  <div id="gres" style="margin-top:12px;max-height:360px;overflow-y:auto"></div>`);
  const run=()=>{
    const R=$('#gres'); if(!R)return;
    const qq=($('#gq').value||'').trim().toLowerCase();
    if(qq.length<2){R.innerHTML='<small style="color:var(--tx2)">Набери хотя бы 2 буквы — найду приложения, шаблоны, уроки и реестр.</small>'; return;}
    const out=[];
    S.apps.filter(a=>(a.name||'').toLowerCase().includes(qq)).slice(0,5).forEach(a=>out.push(`<div class="entrow" data-gs="open:${a.id}" style="cursor:pointer"><span class="ri">${a.icon||'📦'}</span><div style="flex:1;min-width:0"><b>${esc(a.name)}</b><small>моё приложение</small></div><span class="feat">открыть</span></div>`));
    TPL.filter(t=>(t.name+' '+t.desc).toLowerCase().includes(qq)).slice(0,6).forEach(t=>out.push(`<div class="entrow" data-gs="create:${t.id}" style="cursor:pointer"><span class="ri">${svg(RT_ICON[t.rt]||'package',18)}</span><div style="flex:1;min-width:0"><b>${esc(t.name)}</b><small>шаблон · ${esc((catById(t.cat)||{name:''}).name)}</small></div><span class="feat">создать</span></div>`));
    LEARN.filter(t=>(t.name+' '+t.desc).toLowerCase().includes(qq)).slice(0,4).forEach(t=>out.push(`<div class="entrow" data-gs="learn:${t.id}" style="cursor:pointer"><span class="ri">${t.icon}</span><div style="flex:1;min-width:0"><b>${esc(t.name)}</b><small>обучение · ${t.lessons.length} ${plural(t.lessons.length,'урок','урока','уроков')}</small></div><span class="feat">учить</span></div>`));
    let regn=0;
    REGFLAT.forEach((it,i)=>{if(regn<6&&(it[0]+' '+it[4]).toLowerCase().includes(qq)){out.push(`<div class="entrow" data-gs="regru:${i}" style="cursor:pointer"><span class="ri">${it[1]}</span><div style="flex:1;min-width:0"><b>${esc(it[0])}</b><small>реестр А-Я · ${esc(it[4])}</small></div><span class="feat">создать</span></div>`); regn++;}});
    let latn=0;
    LATFLAT.forEach((it,i)=>{if(latn<4&&(it[0]+' '+it[4]).toLowerCase().includes(qq)){out.push(`<div class="entrow" data-gs="regen:${i}" style="cursor:pointer"><span class="ri">${it[1]}</span><div style="flex:1;min-width:0"><b>${esc(it[0])}</b><small>реестр A-Z · ${esc(it[4])}</small></div><span class="feat">создать</span></div>`); latn++;}});
    R.innerHTML=out.length?out.join(''):`<div class="empty" style="padding:20px">Ничего не нашлось по «${esc(qq)}». Попробуй иначе: «трекер», «музыка», «python»…</div>`;
    $$('#gres [data-gs]').forEach(x=>x.onclick=()=>{
      const g=x.dataset.gs;
      if(g.startsWith('open:')){closeModal(); navTo('app:'+g.slice(5));}
      else if(g.startsWith('create:')){closeModal(); buildFromTemplate(g.slice(7));}
      else if(g.startsWith('learn:')){closeModal(); navTo('learn'); learnTopic=g.slice(6); setTimeout(paintLearnTopic,0);}
      else if(g.startsWith('regru:')){closeModal(); abzTab='ru'; buildFromReg(+g.slice(6));}
      else if(g.startsWith('regen:')){closeModal(); abzTab='en'; buildFromReg(+g.slice(6));}});
  };
  $('#gq').oninput=run; run();
  setTimeout(()=>{const i=$('#gq'); if(i){i.focus(); i.setSelectionRange(i.value.length,i.value.length);}},40);
}

   {t:'Сортировка пузырьком',blocks:[['Идём по списку, сравниваем соседей, меняем местами, если порядок неверный. Повторяем, пока всё не встанет.'],['for i in range(n):\n  for j in range(n-1):\n    if a[j] > a[j+1]:\n      a[j], a[j+1] = a[j+1], a[j]','code'],['Медленно, но красиво: так проще всего понять сортировку. В реальности используют быстрые алгоритмы.']],

const LEARN_EXT=[{"id": "js", "lessons": [{"t": "Объекты: всё сложное — из простого", "run": "const user = { name: \"Аня\", age: 20 };\nconsole.log(user.name, user.age);\nuser.city = \"Москва\";\nconsole.log(user);", "blocks": [["Объект хранит связанные данные вместе: {ключ: значение}. Доступ — через точку."], ["Свойства можно добавлять и менять на ходу — объект гибкий:", ["const user = { name: \"Аня\" };\nuser.age = 20;\nconsole.log(user);", "code"]]], "quiz": {"q": "Как получить имя из const u = {name:\"Аня\"}?", "opts": ["u.name", "u(name)", "name(u)"], "a": 0}, "task": {"q": "Доступ к свойству объекта: u.____ (как называется поле)", "ans": "name", "hint": "Свойство называется name."}}, {"t": "Методы массивов: map и filter", "run": "const nums=[1,2,3,4];\nconsole.log(nums.map(n=>n*2));\nconsole.log(nums.filter(n=>n%2===0));", "blocks": [["map превращает каждый элемент, filter отбирает подходящие — стиль современного JS."], ["map: из чисел — их квадраты. filter: только чётные:", ["const nums=[1,2,3,4];\nconsole.log(nums.map(n=>n*n));\nconsole.log(nums.filter(n=>n%2===0));", "code"]]], "quiz": {"q": "Что вернёт [1,2,3].map(n=>n+1)?", "opts": ["[2,3,4]", "[1,2,3]", "6"], "a": 0}, "task": {"q": "Метод, который отбирает элементы по условию?", "ans": "filter", "hint": "Как фильтр для воды."}}, {"t": "Ссылки и копии объектов", "run": "const a={x:1};\nconst b={...a};\nb.x=5;\nconsole.log(a.x);", "blocks": [["Объекты передаются по ссылке: b=a — один объект с двумя именами. Изменил через b — изменилось a."], ["Копия делается через spread — три точки:", ["const a={x:1};\nconst b={...a};\nb.x=5;\nconsole.log(a.x); // 1", "code"]]], "quiz": {"q": "const b={...a} — это…", "opts": ["Копия объекта", "Ссылка на тот же объект", "Ошибка"], "a": 0}, "task": {"q": "Оператор поверхностной копии — три…", "ans": "...", "hint": "Точки — spread."}}, {"t": "try/catch: ошибки под контролем", "run": "try {\n  JSON.parse(\"{сломанный json\");\n} catch (e) {\n  console.log(\"Поймал:\", e.message.slice(0, 20));\n}", "blocks": [["try/catch — «попробуй, а если упадёт — поймай»: программа не умирает, а обрабатывает ошибку."], ["throw new Error(\"текст\") — выбросить ошибку самому:", ["function divide(a, b) {\n  if (b === 0) throw new Error(\"На ноль нельзя!\");\n  return a / b;\n}\ntry { divide(1, 0); } catch (e) { console.log(e.message); }", "code"]]], "quiz": {"q": "Что выполняется при ошибке в try?", "opts": ["catch", "finally всегда", "else"], "a": 0}, "task": {"q": "Блок, который ловит ошибку: try/____", "ans": "catch", "hint": "Ловит, как мяч."}}, {"t": "JSON: язык обмена данными", "run": "const s = JSON.stringify({a: 1});\nconsole.log(s);\nconsole.log(JSON.parse(s).a);", "blocks": [["JSON — текстовый формат данных: так приложения обмениваются информацией."], ["stringify — объект в строку, parse — строку в объект:", ["const obj = {ok: true};\nconst str = JSON.stringify(obj);\nconst back = JSON.parse(str);\nconsole.log(back.ok);", "code"]]], "quiz": {"q": "Что превращает строку в объект?", "opts": ["JSON.parse", "JSON.stringify", "toString"], "a": 0}, "task": {"q": "Метод сохранения объекта в строку: JSON.________", "ans": "stringify", "hint": "Сделать строкой."}}, {"t": "DOM: страница из JavaScript", "run": "// DOM в песочнице недоступен — пробуй в консоли браузера (F12)\nconsole.log(\"document — только в настоящем браузере\");", "blocks": [["DOM — дерево страницы. JavaScript меняет любой элемент: текст, стили, добавляет новые."], ["Найти элемент и поменять:", ["document.querySelector(\"h1\").textContent = \"Новый заголовок\";\ndocument.body.style.background = \"#f0f8ff\";", "code"]], ["Песочница HUB выполняет чистый JS — DOM доступен только в настоящем браузере (F12)."]], "quiz": {"q": "Как найти элемент страницы из JS?", "opts": ["document.querySelector()", "page.find()", "DOM.get()"], "a": 0}, "task": {"q": "Объект страницы в браузере называется…", "ans": "document", "hint": "Документ."}}, {"t": "События: страница слушает", "run": "// Схема событий: ": "sql", "new": true, "meta": {"name": "SQL и базы данных", "icon": "🗄️", "grad": ["#0b7285", "#15aabf"], "desc": "Язык баз данных: таблицы, запросы, связи — фундамент всех приложений."}, "lessons": [{"t": "Базы данных и таблицы", "blocks": [["База данных хранит информацию в таблицах: строки — записи, колонки — поля."], ["SQL — язык запросов к базам. Им говорит почти всё: банки, магазины, соцсети.", ["CREATE TABLE users (\n  name TEXT,\n  age INTEGER\n);", "code"]], ["В Студии HUB есть настоящий SQL-редактор — открой файл База/схема.sql и выполняй запросы кнопкой ▶."]], "quiz": {"q": "Строка таблицы БД — это…", "opts": ["Запись", "Колонка", "Файл"], "a": 0}, "task": {"q": "Язык запросов к базам данных — …", "ans": "sql", "hint": "Три буквы."}}, {"t": "SELECT: выбери данные", "blocks": [["SELECT — самая частая команда: «покажи»."], ["SELECT * FROM users;", "code"], ["Звёздочка — все колонки. Можно и конкретные: SELECT name FROM users;"]], "quiz": {"q": "Что вернёт SELECT * FROM users?", "opts": ["Все строки и колонки", "Только имена", "Ничего"], "a": 0}, "task": {"q": "Команда выборки данных: ____", "ans": "select", "hint": "Выбрать."}}, {"t": "WHERE: фильтр", "blocks": [["WHERE отбирает строки по условию:"], ["SELECT * FROM users WHERE age > 18;", "code"], ["Операторы: =, >, <, >=, !=, AND, OR, LIKE «похоже на»."]], "quiz": {"q": "Как отобрать взрослых?", "opts": ["WHERE age >= 18", "FILTER adults", "IF age > 18"], "a": 0}, "task": {"q": "Условие отбора строк пишется после слова…", "ans": "where", "hint": "Где."}}, {"t": "ORDER BY и LIMIT", "blocks": [["ORDER BY сортирует, LIMIT ограничивает:"], ["SELECT name, age FROM users\nORDER BY age DESC\nLIMIT 5;", "code"], ["DESC — по убыванию, ASC — по возрастанию. Топ-5 — классика запросов."]], "quiz": {"q": "ORDER BY age DESC — как отсортирует?", "opts": ["От старых к молодым", "От молодых к старым", "Перемешает"], "a": 0}, "task": {"q": "Ключевое слово ограничения количества строк?", "ans": "limit", "hint": "Предел."}}, (n) {\n  if (n <= 1) return 1;\n  return n * fact(n - 1);\n}\nconsole.log(fact(5)); // 120", "code"], ["Главное — база выхода (if n <= 1), иначе — бесконечность."]], "quiz": {"q": "Что обязательно у рекурсии?", "opts": ["База выхода", "Цикл for", "Класс"], "a": 0}, "task": {"q": "Функция, вызывающая саму себя, — …", "ans": "рекурсия", "hint": "Восемь букв."}}, {"t": "Бинарный поиск: половина за шаг", "blocks": [["В отсортированном списке ищем делением пополам: середина — половина отпадает."], ["Миллион элементов — 20 шагов вместо миллиона! Это O(log n).", ["// Загадай число 1..100\n// «больше 50?» «больше 75?» — угадал за 7 вопросов", "code"]]], "quiz": {"q": "Сколько шагов на миллион элементов у бинарного поиска?", "opts": ["~20", "~1000", "Миллион"], "a": 0}, "task": {"q": "Поиск делением пополам называется …", "ans": "бинарный", "hint": "Два — bi."}}, {"t": "Хеш-таблицы: мгновенный доступ", "blocks": [["Хеш-таблица (объект в JS, словарь в Python) находит значение по ключу мгновенно — O(1)."], ["user = {\"name\": \"Аня\"}\n# ключ сразу указывает на ячейку — без перебора", "code"], ["На них построены кэши, базы данных, словари."]], "quiz": {"q": "Скорость доступа по ключу в хеш-таблице?", "opts": ["O(1) — мгновенно", "O(n)", "O(n²)"], "a": 0}, "task": {"q": "В Python хеш-таблица называется …", "ans": "словарь", "hint": "dict по-английски."}}, {"t": "Стек и очередь", "blocks": [["Стек — стопка: последний пришёл — первый вышел. Очередь — как в магазине: первый — первый вышел."], ["Стек: кнопка «назад» в браузере. Очередь: печать документов.", ["// Стек\nconst st=[]; st.push(1); st.push(2);\nconsole.log(st.pop()); // 2", "code"]], ["История Ctrl+Z — тоже стек."]], "quiz": {"q": "Ctrl+Z работает по принципу…", "opts": ["Стека", "Очереди", "Списка"], "a": 0}, "task": {"q": "Структура «первым пришёл — первым вышел» — …", "ans": "очередь", "hint": "Как в магазине."}}, {"t": "Динамическое программирование: идея", "blocks": [["ДП — разбить задачу на подзадачи и запоминать о   return `<h1>🎓 Обучение</h1><p class="sub">Языки программирования, алгоритмы и сама платформа HUB — в трёх форматах</p>

function gainXP(){
  const today=dayKey(new Date());
  if(S.learn.last!==today){S.learn.streak=(S.learn.last===dayKey(new Date(Date.now()-864e5)))?S.learn.streak+1:1; S.learn.last=today;}
  S.learn.xp+=10; save();
}

  $$('div[data-ltopic]').forEach(c=>c.onclick=e=>{if(e.target.closest('[data-act]'))return; const tt=e.target.closest('[data-ltopic]'); learnTopic=(tt||c).dataset.ltopic; paintLearnTopic();});

    <div class="todo" style="margin-top:6px"><input class="inp" data-ta="${i}" placeholder="Твой ответ…" style="flex:1"><button class="btn sm acc" data-tgo="${i}">Проверить</button></div><div data-tres="${i}" style="margin-top:4px"></div></div></div>`:'').join('')||'<p style="color:var(--tx2)">Задач в теме пока нет</p>'}</div>`
  :game?`<div class="panel" style="margin-top:12px"><h3>🎮 Путь: ${esc(t.name)}</h3><div class="lpath">${t.lessons.map((ls,i)=>{

  :`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:12px">${list.map(({ls,i})=>`

    ${ls.run||ls.blocks.some(b=>b.length>1&&b[1]==='code')?'<span class="feat">▶ примеры</span>':''}${ls.task?'<span class="feat">🧪 задача</span>':''}

  $$('[data-llesson]').forEach(b=>b.onclick=()=>openLesson(t,+b.dataset.llesson));
  $$('#learnBody [data-lqi]').forEach(ch=>ch.onclick=()=>{
    const ls=t.lessons[+ch.dataset.lqi];
    if(+ch.dataset.oi===ls.quiz.a){ch.style.borderColor='var(--ok)'; ch.style.color='var(--ok)'; toast('Верно! 🎉 Открой урок — разберём подробнее');}
    else {ch.style.borderColor='#f59f00'; ch.style.color='#f59f00';}});
  $$('[data-tgo]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.tgo, ls=t.lessons[i], ip=document.querySelector(`[data-ta="${i}"]`);

    if(ok&&!done.includes(i)){S.learn.done[t.id]=[...done,i]; gainXP(); save(); toast('Урок засчитан +10 XP ⚡'); paintLearnTopic();}});
}
const norm=s=>String(s||'').trim().toLowerCase().replace(/[«»"'`]/g,'').replace(/\^2/g,'²').replace(/\s+/g,' ');
function openLesson(t,i){
  const box=$('#lessonBox'); if(!box)return;
  box.innerHTML=lessonHTML(t,i); box.scrollIntoView({behavior:'smooth',block:'start'});
  const done=S.learn.done[t.id]||[];
  const markDone=()=>{ if(!done.includes(i)){S.learn.done[t.id]=[...done,i]; gainXP(); save(); toast('+10 XP ⚡ — урок отмечен в пути');}
    paintLearnTopic(); openLesson(t,i);};
  $$('[data-lrun]').forEach(b=>b.onclick=()=>{const code=b.dataset.lrun;
    let pa=S.apps.find(x=>x.rt==='play');
    if(!pa){pa={id:uid(),name:'Песочница кода',icon:'▶️',cat:'code',tpl:'play',rt:'play',feats:['Запуск JS','Вывод console','Объяснение ошибок'],created:Date.now(),data:{}}; S.apps.unshift(pa); bump('code'); save();}
    pa.data.code=code; save(); toast('Пример загружен в песочницу ▶'); navTo('app:'+pa.id);});
  $$('[data-lcopy]').forEach(b=>b.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(b.dataset.lcopy); toast('Код скопирован');});
  const qz=box.querySelector('[data-lquiz]');
  if(qz){const ls=t.lessons[i];
    $$('#lessonBox [data-lquiz] .chip').forEach(ch=>ch.onclick=()=>{
      if(+ch.dataset.o===ls.quiz.a){ch.style.borderColor='var(--ok)'; ch.style.color='var(--ok)'; toast('Верно! 🎉'); markDone();}
      else{ch.style.borderColor='var(--warn,#f59f00)'; ch.style.color='var(--warn,#f59f00)'; toast('Не то — попробуй ещё');}});}
  const ltGo=$('#ltGo');
  if(ltGo){const ls=t.lessons[i];
    ltGo.onclick=()=>{const ok=norm($('#ltAns').value)===norm(ls.task.ans);
      $('#ltRes').innerHTML=ok?`<div class="notecard" style="border-color:var(--ok)"><b>✅ Верно!</b> Задача закрыта, +10 XP.</div>`:`<div class="notecard" style="border-color:var(--warn,#f59f00)"><b>Ещё попытка</b><p style="color:var(--tx2);font-size:13px;margin-top:4px">${esc(ls.task.hint)}</p></div>`;
      if(ok)markDone();};
    $('#ltHint').onclick=()=>{$('#ltRes').innerHTML=`<p style="color:var(--tx2);font-size:13px">💡 ${esc(ls.task.hint)}</p>`;};}
  const back=$('#lsBack'); if(back)back.onclick=()=>{box.innerHTML=''; paintLearnTopic();};
  const nx=$('#lsNext'); if(nx)nx.onclick=()=>openLesson(t,i+1);
}

function hubHTML(){

  const week=S.stats.week; seedWeek();
  const days=[]; const d=new Date();
  const names=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
  for(let i=6;i>=0;i--){const dd=new Date(d-864e5*i); days.push({k:dayKey(dd),n:names[dd.getDay()],v:week[dayKey(dd)]||0});}
  const max=Math.max(...days.map(x=>x.v),1);
  const catEntries=Object.entries(S.stats.cat).filter(([k,v])=>v>0&&catById(k)).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const total=catEntries.reduce((s,[,v])=>s+v,0)||1;
  let acc=0; const stops=catEntries.map(([k,v])=>{const c=catById(k); const a0=acc/total*100; acc+=v; const a1=acc/total*100; return `${c.grad[0]} ${a0}% ${a1}%`;}).join(',');
  const ROLTPL={admin:['admin','crm','charts','filehub','term'],staff:['tasks','crm','filehub','calc','term']};
  const roleRecs=ROLTPL[S.profile.role];

function aeNote(f,d,w,v){const t=AE.ctx.currentTime; const o=AE.ctx.createOscillator(); o.type=w; o.frequency.value=f; const g=AE.ctx.createGain();

  o.connect(g); g.connect(AE.gain); o.start(t); o.stop(t+d+.05);}

RT.music=(el,a)=>{
