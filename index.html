  a.data.q=a.data.q||''; a.data.pl=a.data.pl||'all'; a.data.cur=a.data.cur||0;
  const T0=a.data.tracks;
  const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
  let playing=false, pos=0;
  const isFav=i=>a.data.favs.includes(i);
  const list=()=>{let ids=T0.map((t,i)=>i);
    if(a.data.pl==='fav')ids=ids.filter(i=>isFav(i));
    if(a.data.pl==='beat')ids=ids.filter(i=>T0[i].kind==='beat');
    if(a.data.pl==='radio')ids=ids.filter(i=>T0[i].kind==='radio');
    (a.data.playlists||[]).forEach(p=>{if(a.data.pl==='p:'+p.n)ids=ids.filter(i=>p.ids.includes(i));});
    const q=(a.data.q||'').toLowerCase();
    if(q)ids=ids.filter(i=>(T0[i].t+' '+T0[i].a).toLowerCase().includes(q));
    return ids;};
  el.innerHTML=`<div class="mus3">
    <div class="panel" style="margin:0;padding:12px">
      <div class="cover" id="cv" style="width:100%;aspect-ratio:1;border-radius:14px;display:grid;place-items:center;font-size:44px"></div>
      <b id="pT" style="display:block;margin-top:10px;font-size:15px"></b>
      <small id="pA" style="color:var(--tx2)"></small>
      <h3 style="margin:14px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--tx2)">Плейлисты</h3>
      <div class="bpl" id="musPl"></div>
    </div>
    <div style="min-width:0">
      <div class="rt-head"><h3>🎧 Плеер</h3><span class="rt-tag" id="musTag"></span></div>
      <input class="inp" id="pSearch" placeholder="🔍 Поиск по трекам и исполнителям…" style="margin-bottom:8px">
      <div id="plist" style="max-height:340px;overflow-y:auto"></div>
    </div>
  </div>
  <div class="panel" style="margin-top:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <button class="psm" id="pPrev">⏮</button><button class="pbig" id="pPlay">▶</button><button class="psm" id="pNext">⏭</button>
    <span id="pCur" style="color:var(--tx2);font-size:11px">0:00</span>
    <div class="seekbar" id="seekB" style="flex:1;min-width:120px"><i id="seekI"></i></div>
    <span id="pDur" style="color:var(--tx2);font-size:11px"></span>
    🔈<input type="range" id="pVol" min="0" max="100" value="70" style="width:90px">
    <button class="btn sm ${a.data.shuffle?'acc':''}" id="pShuf" data-tooltip="Перемешать порядок">🔀</button>
  </div>`;
  const g=(cat)=>`linear-gradient(135deg,${(catById(a.cat)||CATS[0]).grad[0]},${(catById(a.cat)||CATS[0]).grad[1]})`;
  const paintPl=()=>{
    const items=[['all','🎵 Все треки'],['fav','❤️ Любимые'],['beat','🥁 Биты'],['radio','📡 Радио'],...(a.data.playlists||[]).map(p=>['p:'+p.n,'📃 '+p.n])];
    $('#musPl').innerHTML=items.map(([k,n])=>`<button data-pl="${esc(k)}" style="${a.data.pl===k?'border-color:var(--acc)':''}">${n}</button>`).join('');
    $$('#musPl [data-pl]').forEach(b=>b.onclick=()=>{a.data.pl=b.dataset.pl; save(); paintAll();});};
  const paintAll=()=>{
    paintPl();
    const ids=list(); const tr=T0[a.data.cur];
    $('#cv').style.background=g(); $('#cv').textContent=tr.kind==='beat'?'🥁':tr.kind==='radio'?'📡':'🎵';
    $('#pT').textContent=tr.t; $('#pA').textContent=tr.a; $('#pDur').textContent=fmt(tr.dur);
    $('#musTag').textContent=`${T0.length} треков · база в памяти ✔`;
    $('#pSearch').value=a.data.q||'';
    $('#pSearch').oninput=e=>{a.data.q=e.target.value; save(); paintAll();};
    $('#plist').innerHTML=ids.map(i=>{const t=T0[i]; return `<div class="trk ${i===a.data.cur?'on':''}" data-i="${i}"><span class="num">${i===a.data.cur&&playing?'♪':i+1}</span>
      <div class="tn" style="flex:1;min-width:0"><b>${esc(t.t)}</b><small>${esc(t.a)} · ${fmt(t.dur)}</small></div>
      <button class="btn sm ghost" data-fav="${i}" style="min-width:32px">${isFav(i)?'❤️':'🤍'}</button>
      <button class="btn sm ghost" data-topl="${i}" data-tooltip="В плейлист">＋</button>
      <span style="color:var(--tx2)">${t.kind==='beat'?'🥁':t.kind==='radio'?'📡':'🎵'}</span></div>`;}).join('')||'<small style="color:var(--tx2)">Здесь пусто — переключи плейлист или убери поиск</small>';
    $$('#plist .trk').forEach(x=>x.onclick=e=>{if(e.target.closest('[data-fav],[data-topl]'))return; a.data.cur=+x.dataset.i; pos=0; play(true);});
    $$('#plist [data-fav]').forEach(c=>c.onclick=e=>{e.stopPropagation(); const i=+c.dataset.fav;
      a.data.favs=isFav(i)?a.data.favs.filter(x=>x!==i):[...a.data.favs,i]; save(); paintAll();});
    $$('#plist [data-topl]').forEach(c=>c.onclick=e=>{e.stopPropagation(); const i=+c.dataset.topl;
      if(!(a.data.playlists||[]).length){a.data.playlists=[{n:'Мой плейлист',ids:[]}];}
      a.data.playlists[0].ids=[...new Set([...a.data.playlists[0].ids,i])]; save(); toast('В плейлист «'+a.data.playlists[0].n+'» ✓'); paintAll();});
    $('#pShuf').onclick=()=>{a.data.shuffle=!a.data.shuffle; save(); paintAll();
      if(a.data.shuffle){const L=list(); const nx=L[Math.floor(Math.random()*L.length)]; if(nx!==undefined){a.data.cur=nx; pos=0; paintAll(); play(true);}}};
  };
  function play(force){
    const tr=T0[a.data.cur];
    if(playing&&!force){pause(); return;}
    stopAudio(); const ok=aeStart(tr); playing=!!ok; $('#pPlay').textContent=playing?'⏸':'▶';
    $('#pCur').textContent='0:00'; $('#seekI').style.width='0%';
    if(playing){AE.prog=setInterval(()=>{pos+=.5; if(pos>=tr.dur){next(); return;}
      const c=$('#pCur'); if(c)c.textContent=fmt(pos); const s=$('#seekI'); if(s)s.style.width=(pos/tr.dur*100)+'%';},500);}
  }
  function pause(){stopAudio(); playing=false; const b=$('#pPlay'); if(b)b.textContent='▶';}
  function next(){const L=list(); let ix=L.indexOf(a.data.cur);
    if(a.data.shuffle&&L.length){ix=Math.floor(Math.random()*L.length);} else ix=(ix+1)%Math.max(1,L.length);
    a.data.cur=L[ix]!==undefined?L[ix]:0; pos=0; paintAll(); play(true);}
  function prev(){const L=list(); let ix=L.indexOf(a.data.cur); ix=(ix-1+L.length)%Math.max(1,L.length);
    a.data.cur=L[ix]!==undefined?L[ix]:0; pos=0; paintAll(); play(true);}
  el.querySelector('#pPlay').onclick=()=>play(false);
  el.querySelector('#pNext').onclick=next;
  el.querySelector('#pPrev').onclick=prev;
  el.querySelector('#pVol').oninput=e=>{if(AE.gain)AE.gain.gain.value=(+e.target.value/100)*.14;};
  paintAll();
};

RT.quiz=(el,a)=>{
  a.data.qs=a.data.qs||QUIZ_SEED.map(q=>({...q}));
  let i=0,score=0,done=false; const qOrder={};
  el.innerHTML=`<div class="rt-head"><h3>❓ Квиз</h3><span class="rt-tag" id="qTag"></span><button class="btn sm" id="qAdd">+ Свой вопрос</button></div>
  <div class="prog" style="margin-bottom:12px"><i id="qProg"></i></div><div id="qBody"></div>`;
  const paint=()=>{
    if(!a.data.qs.length){$('#qBody').innerHTML=`<div class="empty" style="padding:18px">Добавь первый вопрос ✍️</div>`; $('#qTag').textContent='0 вопросов'; return;}
    if(done){$('#qBody').innerHTML=`<div style="text-align:center;padding:26px 0"><div style="font-size:40px">${score===a.data.qs.length?'🏆':'🎯'}</div>
      <h3 style="margin:10px 0">Счёт: ${score} из ${a.data.qs.length}</h3><button class="btn acc" id="qRe">Играть снова</button></div>`;
      $('#qRe').onclick=()=>{i=0;score=0;done=false;paint();}; $('#qTag').textContent='раунд завершён'; $('#qProg').style.width='0'; return;}
    const q=a.data.qs[i];
    if(!qOrder[i])qOrder[i]=q.opts.map((_,k)=>k).sort(()=>Math.random()-.5);
    const order=qOrder[i];
    $('#qTag').textContent=`Вопрос ${i+1}/${a.data.qs.length} · счёт ${score}`;
    $('#qProg').style.width=(i/a.data.qs.length*100)+'%';
    $('#qBody').innerHTML=`<h3 style="margin-bottom:14px;font-size:17px">${esc(q.q)}</h3>`+order.map((oi,pos)=>`<button class="qopt" data-o="${pos}">${esc(q.opts[oi])}</button>`).join('');
    $$('#qBody .qopt').forEach(b=>b.onclick=()=>{
      const ok=order[+b.dataset.o]===q.a; b.classList.add(ok?'ok':'bad');
      if(ok)score++; else $$('#qBody .qopt')[order.indexOf(q.a)].classList.add('ok');
      $$('#qBody .qopt').forEach(x=>x.style.pointerEvents='none');
      setTimeout(()=>{i++; if(i>=a.data.qs.length)done=true; paint();},800);});};
  $('#qAdd').onclick=()=>{
    const q=prompt('Вопрос:'); if(!q)return; const o1=prompt('Вариант 1:');if(!o1)return; const o2=prompt('Вариант 2:');if(!o2)return; const o3=prompt('Вариант 3 (может совпадать смыслом, оставь пустым чтобы пропустить):')||'Не знаю';
    const a2=prompt('Номер правильного (1-3):','1');
    a.data.qs.push({q,opts:[o1,o2,o3],a:Math.min(2,Math.max(0,(+a2||1)-1))}); save(); toast('Вопрос добавлен'); paint();};
  paint();
};

  const hsl=(h,s,l)=>{const f=n=>{const k=(n+h/30)%12; const c=l/100-s/100*Math.min(l/100,1-l/100)*Math.max(-1,Math.min(k-3,9-k,1)); return Math.round(255*c).toString(16).padStart(2,'0');}; return '#'+f(0)+f(8)+f(4);};

  el.innerHTML=`<div class="rt-head"><h3>${a.icon} ${esc(a.name)}</h3><span class="rt-tag">личный агент</span></div>

function personaMini(a){return {answer:t=>{const x=t.toLowerCase();
  if(/привет|хай|здравств/.test(x))return `${esc(a.icon)} Привет-привет! ${a.skills&&a.skills.length?'Моя стихия — '+esc(a.skills.join(' и '))+'.':'Рассказывай, что нужно!'}`;

/* --- калькулятор --- */
RT.calc=(el)=>{
  let cur='0',acc=null,op=null,fresh=false; const hist=[];
  el.innerHTML=`<div class="rt-head"><h3>🧮 Калькулятор</h3><span class="rt-tag">клавиатура работает</span></div>
  <div class="calcdisp" id="cd">0</div>
  <div class="calcpad">${['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0',',','='].map(k=>`<button class="calcbtn ${'÷×−+%'.includes(k)?'op':''} ${k==='='?'eq':''}" data-k="${k}">${k}</button>`).join('')}</div>
  <div id="ch2" style="margin-top:10px"></div>`;
  const upd=()=>{$('#cd').textContent=cur; $('#ch2').innerHTML=hist.slice(-5).reverse().map(h=>`<div class="entrow" style="padding:6px 10px"><small style="color:var(--tx2)">${esc(h)}</small></div>`).join('');};
  const calc=(a,b,o)=>o==='+'?a+b:o==='−'?a-b:o==='×'?a*b:o==='÷'?(b?a/b:NaN):o==='%'?a%b:b;
  const key=k=>{
    if(/[0-9]/.test(k)){cur=(cur==='0'||fresh)?k:cur+k; fresh=false;}
    else if(k===','){if(!cur.includes('.'))cur=fresh?'0.':cur+'.'; fresh=false;}
    else if(k==='C'){cur='0';acc=null;op=null;}
    else if(k==='⌫'){cur=cur.slice(0,-1)||'0';}
    else if(k==='±'){cur=String(-parseFloat(cur)||0);}
    else if(k==='='){ if(op!==null){const r=calc(acc,parseFloat(cur),op); const out=isFinite(r)?String(+r.toFixed(8)):'Ошибка'; hist.push(`${acc} ${op} ${cur} = ${out}`); cur=out; acc=null;op=null; fresh=true;} }
    else { if(op!==null&&!fresh){const r=calc(acc,parseFloat(cur),op); if(isFinite(r))acc=+r.toFixed(8);} else acc=parseFloat(cur)||0; op=k; fresh=true; }
    upd();};
  el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>key(b.dataset.k));
  document.onkeydown=e=>{if(!$('#cd')||!route.startsWith('app:'))return;
    const m={'/':'÷','*':'×','-':'−','+':'+','%':'%','Enter':'=','=':'=','Backspace':'⌫','Escape':'C','.':','};
    if(/[0-9]/.test(e.key))key(e.key); else if(m[e.key]){e.preventDefault();key(m[e.key]);}};
  upd();
};

/* --- конструктор сайтов --- */
/* ================= ГЕНЕРАТОР ИЗОБРАЖЕНИЙ (SVG, офлайн, детерминированный) ================= */
function mulberry32(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function imgSVG(seed,motif,w=640,h=420){
  const r=mulberry32(seed*7919+13);
  const hu=Math.floor(r()*360);
  const c1=`hsl(${hu},62%,${18+r()*14|0}%)`, c2=`hsl(${(hu+40+r()*60)%360},70%,${30+r()*22|0}%)`, c3=`hsl(${(hu+180)%360},55%,62%)`;
  const S=[];
  S.push(`<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>`);
  S.push(`<rect width="${w}" height="${h}" fill="url(#g)"/>`);
  if(motif==='mountain'){
    S.push(`<circle cx="${w*.72}" cy="${h*.26}" r="${h*.11}" fill="${c3}" opacity=".9"/>`);
    for(let L=0;L<3;L++){const y=h*(.5+L*.16), amp=h*(.22-L*.05); let p=`0,${h} `;
      for(let x=0;x<=w;x+=w/8)p+=`${x},${(y-amp*r()+(L?amp*.4:0)).toFixed(0)} `;
      p+=`${w},${h}`; S.push(`<polygon points="${p}" fill="hsl(${(hu+L*24)%360},45%,${20+L*9}%)" opacity="${.75+L*.08}"/>`);}
  }else if(motif==='city'){
    S.push(`<circle cx="${w*.3}" cy="${h*.3}" r="${h*.1}" fill="${c3}" opacity=".85"/>`);
    let x=0; while(x<w){const bw=w*(.06+r()*.09), bh=h*(.25+r()*.45);
      S.push(`<rect x="${x.toFixed(0)}" y="${(h-bh).toFixed(0)}" width="${bw.toFixed(0)}" height="${bh.toFixed(0)}" fill="hsl(${hu},30%,${12+r()*10}%)" opacity=".92"/>`);
      for(let wy=h-bh+8;wy<h-6;wy+=11)for(let wx=x+4;wx<x+bw-5;wx+=9)if(r()>.5)S.push(`<rect x="${wx.toFixed(0)}" y="${wy.toFixed(0)}" width="3.4" height="4.6" fill="${c3}" opacity="${.5+r()*.5}"/>`);
      x+=bw+2;}
  }else if(motif==='wave'){
    for(let L=0;L<4;L++){let p=`M0 ${h*.5}`;
      for(let x=0;x<=w;x+=w/16)p+=` L${x} ${(h*.5+Math.sin(x/(w/4)+L*1.8)*h*(.08+L*.045)).toFixed(1)}`;
      S.push(`<path d="${p}" fill="none" stroke="${L%2?c3:'rgba(255,255,255,.55)'}" stroke-width="${(2.5-L*.4).toFixed(1)}" opacity="${.85-L*.16}"/>`);}
    S.push(`<circle cx="${w*.82}" cy="${h*.2}" r="${h*.08}" fill="rgba(255,255,255,.7)"/>`);
  }else if(motif==='cosmos'){
    S.push(`<rect width="${w}" height="${h}" fill="hsl(${hu},60%,7%)"/>`);
    for(let i=0;i<70;i++)S.push(`<circle cx="${(r()*w).toFixed(0)}" cy="${(r()*h).toFixed(0)}" r="${(r()*1.6+.4).toFixed(1)}" fill="rgba(255,255,255,${(.3+r()*.7).toFixed(2)})"/>`);
    const px=w*.6,py=h*.45,pr=h*.24;
    S.push(`<circle cx="${px}" cy="${py}" r="${pr}" fill="${c2}"/><ellipse cx="${px}" cy="${py}" rx="${pr*1.7}" ry="${pr*.42}" fill="none" stroke="${c3}" stroke-width="5" opacity=".8" transform="rotate(-18 ${px} ${py})"/>`);
  }else if(motif==='food'){
    S.push(`<rect width="${w}" height="${h}" fill="hsl(${hu},38%,22%)"/><circle cx="${w/2}" cy="${h/2}" r="${h*.34}" fill="#f4efe8"/><circle cx="${w/2}" cy="${h/2}" r="${h*.27}" fill="none" stroke="${c2}" stroke-width="2" opacity=".5"/>`);
    for(let i=0;i<5;i++){const a=r()*6.28,d=h*(.06+r()*.16);
      S.push(`<circle cx="${(w/2+Math.cos(a)*d).toFixed(0)}" cy="${(h/2+Math.sin(a)*d).toFixed(0)}" r="${(h*.03+r()*h*.05).toFixed(0)}" fill="${['#e8590c','#2f9e44','#f59f00','#c92a2a'][i%4]}"/>`);}
  }else if(motif==='portrait'){
    S.push(`<rect width="${w}" height="${h}" fill="url(#g)"/><circle cx="${w/2}" cy="${h*.4}" r="${h*.17}" fill="${c3}"/><path d="M ${w*.24} ${h} Q ${w/2} ${h*.52} ${w*.76} ${h} Z" fill="${c3}" opacity=".85"/>`);
  }else if(motif==='product'){
    S.push(`<rect width="${w}" height="${h}" fill="hsl(${hu},30%,92%)"/><ellipse cx="${w/2}" cy="${h*.78}" rx="${w*.24}" ry="${h*.05}" fill="rgba(0,0,0,.14)"/><rect x="${w*.34}" y="${h*.3}" width="${w*.32}" height="${h*.4}" rx="${h*.04}" fill="${c2}"/><rect x="${w*.34}" y="${h*.3}" width="${w*.32}" height="${h*.08}" rx="${h*.03}" fill="${c1}"/>`);
  }else if(motif==='travel'){
    S.push(`<rect width="${w}" height="${h*.55}" fill="url(#g)"/><rect y="${h*.55}" width="${w}" height="${h*.45}" fill="hsl(${(hu+200)%360},58%,34%)"/>`);
    S.push(`<circle cx="${w*.24}" cy="${h*.2}" r="${h*.1}" fill="${c3}"/>`);
    for(let i=0;i<3;i++)S.push(`<path d="M${w*.1} ${h*(.62+i*.1)} q ${w*.12} ${-h*.04} ${w*.24} 0" stroke="rgba(255,255,255,.6)" fill="none" stroke-width="2.4"/>`);
    S.push(`<path d="M ${w*.66} ${h*.3} l ${w*.09} 0 l ${-w*.03} ${h*.045} Z" fill="#fff" opacity=".92"/>`);
  }else if(motif==='rings'){
    S.push(`<rect width="${w}" height="${h}" fill="url(#g)"/>`);
    for(let i=0;i<26;i++)S.push(`<circle cx="${(r()*w).toFixed(0)}" cy="${(r()*h*.7).toFixed(0)}" r="${(r()*3+1).toFixed(1)}" fill="${c3}" opacity="${(.3+r()*.5).toFixed(2)}"/>`);
    const cx=w/2, cy=h*.55;
    S.push(`<circle cx="${cx-w*.06}" cy="${cy}" r="${h*.2}" fill="none" stroke="#f6e27a" stroke-width="${h*.035}"/><circle cx="${cx+w*.06}" cy="${cy}" r="${h*.2}" fill="none" stroke="#fff" stroke-width="${h*.035}" opacity=".92"/>`);
    S.push(`<path d="M ${cx} ${cy-h*.2} l ${w*.02} ${-h*.05} h ${-w*.04} Z" fill="#f6e27a"/>`);
  }else if(motif==='camera'){
    S.push(`<rect width="${w}" height="${h}" fill="url(#g)"/>`);
    S.push(`<rect x="${w*.18}" y="${h*.3}" width="${w*.64}" height="${h*.44}" rx="${h*.05}" fill="hsl(${hu},25%,14%)" opacity=".94"/><rect x="${w*.4}" y="${h*.22}" width="${w*.2}" height="${h*.1}" rx="${h*.03}" fill="hsl(${hu},25%,14%)"/>`);
    S.push(`<circle cx="${w*.5}" cy="${h*.52}" r="${h*.14}" fill="${c3}"/><circle cx="${w*.5}" cy="${h*.52}" r="${h*.09}" fill="hsl(${hu},25%,10%)"/><circle cx="${w*.46}" cy="${h*.48}" r="${h*.03}" fill="#fff" opacity=".8"/>`);
    S.push(`<circle cx="${w*.74}" cy="${h*.38}" r="${h*.025}" fill="${c3}"/>`);
  }else if(motif==='leaf'){
    S.push(`<rect width="${w}" height="${h}" fill="url(#g)"/>`);
    for(let i=0;i<7;i++){const x=w*(.1+i*.13), y=h*(.3+r()*.4), L=h*(.18+r()*.16), a=(-30+r()*60).toFixed(0);
      S.push(`<ellipse cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" rx="${(L*.45).toFixed(0)}" ry="${L.toFixed(0)}" fill="${i%2?c3:'#ffffff'}" opacity="${(.18+r()*.25).toFixed(2)}" transform="rotate(${a} ${x.toFixed(0)} ${y.toFixed(0)})"/>`);}
    S.push(`<path d="M0 ${h*.85} Q ${w*.5} ${h*.7} ${w} ${h*.85} V ${h} H0 Z" fill="rgba(255,255,255,.14)"/>`);
  }else if(motif==='car'){
    S.push(`<rect width="${w}" height="${h}" fill="url(#g)"/>`);
    S.push(`<rect y="${h*.78}" width="${w}" height="${h*.22}" fill="hsl(${hu},20%,12%)"/>`);
    S.push(`<path d="M ${w*.12} ${h*.72} q ${w*.06} ${-h*.16} ${w*.24} ${-h*.16} h ${w*.22} q ${w*.12} 0 ${w*.2} ${h*.14} l ${w*.06} ${h*.04} h ${-w*.72} Z" fill="${c3}"/>`);
    S.push(`<path d="M ${w*.38} ${h*.58} h ${w*.18} v ${h*.13} h ${-w*.26} Z" fill="hsl(${hu},30%,18%)"/>`);
    S.push(`<circle cx="${w*.28}" cy="${h*.74}" r="${h*.075}" fill="#111"/><circle cx="${w*.72}" cy="${h*.74}" r="${h*.075}" fill="#111"/><circle cx="${w*.28}" cy="${h*.74}" r="${h*.03}" fill="${c3}"/><circle cx="${w*.72}" cy="${h*.74}" r="${h*.03}" fill="${c3}"/>`);
  }else if(motif==='house'){
    S.push(`<rect width="${w}" height="${h}" fill="url(#g)"/>`);
    S.push(`<rect y="${h*.8}" width="${w}" height="${h*.2}" fill="hsl(${hu},30%,16%)"/>`);
    S.push(`<rect x="${w*.22}" y="${h*.45}" width="${w*.56}" height="${h*.35}" fill="${c3}"/><polygon points="${(w*.16).toFixed(0)},${h*.45} ${(w*.5).toFixed(0)},${h*.22} ${(w*.84).toFixed(0)},${h*.45}" fill="hsl(${hu},35%,24%)"/>`);
    S.push(`<rect x="${w*.46}" y="${h*.6}" width="${w*.08}" height="${h*.2}" fill="hsl(${hu},30%,18%)"/><rect x="${w*.3}" y="${h*.52}" width="${w*.1}" height="${h*.1}" fill="#fff" opacity=".85"/><rect x="${w*.6}" y="${h*.52}" width="${w*.1}" height="${h*.1}" fill="#fff" opacity=".85"/>`);
  }else{ // abstract
    for(let i=0;i<4;i++)S.push(`<circle cx="${(r()*w).toFixed(0)}" cy="${(r()*h).toFixed(0)}" r="${(h*(.12+r()*.24)).toFixed(0)}" fill="${i%2?c3:'rgba(255,255,255,.5)'}" opacity="${(.14+r()*.22).toFixed(2)}"/>`);
    S.push(`<path d="M0 ${h*.7} Q ${w*.3} ${h*.4} ${w*.55} ${h*.66} T ${w} ${h*.5} V ${h} H 0 Z" fill="rgba(255,255,255,.16)"/>`);}
  S.push(`<rect width="${w}" height="${h}" fill="url(#noise)" opacity="0"/>`);
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice">${S.join('')}</svg>`);
}
function imgAvatar(seed,name){
  const r=mulberry32(seed*104729+5); const hu=Math.floor(r()*360);
  const ini=(name||'H').trim().split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase();
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><circle cx="48" cy="48" r="48" fill="hsl(${hu},58%,42%)"/><text x="48" y="60" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff" text-anchor="middle">${ini}</text></svg>`);
}

      case 'contact':return `<footer id="c" style="background:${sp.pal.dark?'#00000055':'#00000010'};border-top:1px solid ${sp.pal.fg}1c;margin-top:30px"><div style="max-width:860px;margin:auto;padding:38px 20px;text-align:center">${H('Контакты')}<p style="color:${sp.pal.fg}b3;margin:0 0 14px">hello@${sp.niche.id}.demo · +7 900 000-00-00</p><div style="display:flex;gap:9px;justify-content:center;flex-wrap:wrap">${['Вконтакте','Telegram','YouTube'].map(s=>`<a class="bt" href="#c" style="border:1px solid ${sp.pal.fg}33;color:${sp.pal.fg}">${s}</a>`).join('')}</div><small style="display:block;margin-top:26px;color:${sp.pal.fg}66">© 2026 ${esc(cx.title)} · собрано в HUB</small></div></footer>`;

  $('#sbItemsReset').onclick=()=>{delete T.items; save(); paintSecs(); gen(); toast('Пункты из шаблона');};

  /* --- пересборка картинок --- */

/* --- химические формулы --- */
RT.chem=(el,a)=>{
  const ELS=[['H','Водород',1.008],['C','Углерод',12.011],['N','Азот',14.007],['O','Кислород',15.999],['Na','Натрий',22.990],['Mg','Магний',24.305],['P','Фосфор',30.974],['S','Сера',32.06],['Cl','Хлор',35.45],['K','Калий',39.098],['Ca','Кальций',40.078],['Fe','Железо',55.845]];
  a.data.formula=a.data.formula||'';
  el.innerHTML=`<div class="rt-head"><h3>⚗️ Химические формулы</h3><span class="rt-tag" id="chTag">молярная масса</span></div>
  <div class="calcdisp" id="chF" style="font-size:24px">${esc(a.data.formula)||'—'}</div>
  <div class="rtgrid" style="grid-template-columns:repeat(auto-fill,minmax(86px,1fr))">${ELS.map(e=>`<button class="linkc" data-el="${e[0]}" data-tooltip="${e[1]} · ${e[2]}"><b style="font-size:15px">${e[0]}</b><small style="color:var(--tx2);font-size:10px">${e[2]}</small></button>`).join('')}</div>
  <div class="chiprow" style="padding:8px 0">${[2,3,4,5,6].map(n=>`<button class="chip" data-sub="${n}">${n}<small style="font-size:9px;vertical-align:sub">ₙ</small></button>`).join('')}<button class="chip" data-sub="(">(</button><button class="chip" data-sub=")">)</button></div>
  <div class="acts" style="margin:10px 0"><button class="btn acc" id="chCalc">⚖️ Посчитать</button><button class="btn" id="chClr">Очистить</button><button class="btn" id="chSave">💾 Сохранить в данные</button></div>
  <div id="chRes"></div>`;
  const paint=()=>{$('#chF').textContent=a.data.formula||'—'; save();};
  el.querySelectorAll('[data-el]').forEach(b=>b.onclick=()=>{a.data.formula+=b.dataset.el; paint();});
  el.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{a.data.formula+=b.dataset.sub; paint();});
  $('#chClr').onclick=()=>{a.data.formula=''; paint(); $('#chRes').innerHTML='';};
  $('#chCalc').onclick=()=>{
    const f=a.data.formula; if(!f)return;
    const counts={}; let stack=[counts]; let cur='';
    const flush=()=>{if(cur){const el=ELS.find(x=>x[0]===cur); if(el)stack[stack.length-1][cur]=(stack[stack.length-1][cur]||0); cur='';}};
    for(let i=0;i<f.length;i++){const ch=f[i];
      if(ch==='('){flush(); stack.push({});}
      else if(ch===')'){flush(); const grp=stack.pop(); let num=''; while(i+1<f.length&&/[0-9]/.test(f[i+1])){num+=f[++i];} const mult=num?+num:1;
        for(const k in grp)stack[stack.length-1][k]=(stack[stack.length-1][k]||0)+grp[k]*mult;}
      else if(/[0-9]/.test(ch)){let num=ch; while(i+1<f.length&&/[0-9]/.test(f[i+1])){num+=f[++i];} const t=stack[stack.length-1]; if(cur){} else {const last=Object.keys(t).pop(); if(last!=null){t[last]+= +num-1;}}}
      else if(/[A-Z]/.test(ch)){flush(); cur=ch;}
      else if(/[a-z]/.test(ch)){cur+=ch;}
    }
    flush();
    let mass=0, parts=[];
    for(const sym in counts){const e=ELS.find(x=>x[0]===sym); if(!e)continue; mass+=e[2]*counts[sym]; parts.push(`${sym}×${counts[sym]}`);}
    $('#chRes').innerHTML=parts.length?`<div class="notecard" style="border-color:var(--acc)"><b>Молярная масса: ${mass.toFixed(2)} г/моль</b><p style="color:var(--tx2);font-size:13px;margin-top:5px">Состав: ${parts.join(' · ')}</p></div>`
      :`<div class="empty" style="padding:14px">Не распознал элементы — используй кнопки выше</div>`;
    $('#chTag').textContent=parts.length?mass.toFixed(1)+' г/моль':'молярная масса';};
  $('#chSave').onclick=()=>{toast('Формула сохранена: '+(a.data.formula||'пусто'));};
  paint();
};

/* --- терминал --- */
RT.term=(el,a)=>{
  a.data.log=a.data.log||['HUB Terminal v1.0 — введи help для списка команд'];
  el.innerHTML=`<div class="rt-head"><h3>💻 Терминал</h3><span class="rt-tag">подсказки встроены</span></div>
  <div class="codeed" id="tmL" style="background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;height:250px;overflow-y:auto;white-space:pre-wrap;margin:0">${esc(a.data.log.join('\n'))}</div>
  <div class="todo" style="margin-top:10px"><span style="color:var(--acc);font-family:monospace;font-weight:600">hub&gt;</span><input class="inp" id="tmI" placeholder="команда (help — список)" style="font-family:ui-monospace,Consolas,monospace"><button class="btn acc" id="tmGo">➤</button></div>
  <p style="color:var(--tx2);font-size:11px;margin-top:8px">help · apps · open &lt;имя&gt; · create &lt;имя&gt; · theme dark|light|#hex · calc 2+2*3 · echo текст · time · tour · clear</p>`;
  const run=cmd=>{
    a.data.log.push('hub> '+cmd);
    const parts=cmd.trim().split(/\s+/); const c=(parts[0]||'').toLowerCase(); const arg=parts.slice(1).join(' ');
    const out=m=>a.data.log.push(m);
    switch(c){
      case 'help': out('Команды: apps · open <имя> · create <имя> · theme <dark|light|#hex> · calc <выражение> · echo <текст> · time · tour · clear'); break;
      case 'apps': out(S.apps.length?S.apps.map(x=>x.icon+' '+x.name+' ['+x.rt+']').join('\n'):'Пусто. create <имя>'); break;
      case 'open': {const app=S.apps.find(x=>x.name.toLowerCase().includes(arg.toLowerCase())); out(app?'Открываю: '+app.name:'Не найдено: '+arg); if(app)setTimeout(()=>navTo('app:'+app.id),300); break;}

RT.charts=(el,a)=>{
  a.data.rows=a.data.rows||[{n:'Пн',v:12},{n:'Вт',v:19},{n:'Ср',v:7},{n:'Чт',v:15}];
  el.innerHTML=`<div class="rt-head"><h3>📊 Диаграммы</h3><span class="rt-tag">живые данные</span></div>
  <div class="todo"><input class="inp" id="cnL" placeholder="Подпись" style="flex:0 0 30%"><input class="inp" id="cnV" type="number" placeholder="Значение"><button class="btn acc" id="cnAdd">+</button></div>
  <div class="panel" style="margin-bottom:12px"><h3>Столбцы</h3><div class="bwrap" id="cB"></div><div style="height:22px"></div></div>
  <div class="panel" style="margin-bottom:12px"><h3>Кольцо</h3><div class="donutrow" id="cD"></div></div>
  <div class="panel"><h3>Линия</h3><div id="cL"></div></div>`;
  const paint=()=>{
    const rows=a.data.rows, max=Math.max(...rows.map(r=>+r.v),1), sum=rows.reduce((s,r)=>s+ +r.v,0)||1;
    $('#cB').innerHTML=rows.map(r=>`<div class="bar" style="height:${Math.max(4,r.v/max*100)}%" data-tooltip="${esc(r.n)}: ${r.v}"><em>${r.v}</em><span>${esc(r.n)}</span></div>`).join('');
    let acc=0; const stops=rows.map((r,i)=>{const c=PALETTES[i%PALETTES.length][1]; const a0=acc/sum*100; acc+=+r.v; return `${c} ${a0.toFixed(1)}% ${(acc/sum*100).toFixed(1)}%`;}).join(',');
    $('#cD').innerHTML=`<div class="donut" style="background:conic-gradient(${stops})"><i>${sum}</i></div><div class="dleg">${rows.map((r,i)=>`<span><i class="dot" style="background:${PALETTES[i%PALETTES.length][1]}"></i>${esc(r.n)}<b>${r.v}</b></span>`).join('')}</div>`;
    const w=440,h=130, n=rows.length;
    const pts=rows.map((r,i)=>[45+i*(w-70)/Math.max(1,n-1),h-14-(r.v/max*(h-34))]);
    $('#cL').innerHTML=`<svg viewBox="0 0 ${w} ${h}" style="width:100%" role="img" aria-label="линия значений"><polyline fill="none" stroke="var(--acc)" stroke-width="2.5" points="${pts.map(p=>p.map(x=>x.toFixed(1)).join(',')).join(' ')}"/>${rows.map((r,i)=>`<circle cx="${pts[i][0].toFixed(1)}" cy="${pts[i][1].toFixed(1)}" r="4" fill="var(--acc2)"/><text x="${pts[i][0].toFixed(1)}" y="${(pts[i][1]-9).toFixed(1)}" font-size="10" fill="var(--tx2)" text-anchor="middle">${r.v}</text>`).join('')}</svg>`;
    save();
  };
  $('#cnAdd').onclick=()=>{const n=$('#cnL').value.trim()||'—'; const v=+$('#cnV').value||0; a.data.rows.push({n,v}); $('#cnL').value=''; $('#cnV').value=''; paint();};
  paint();
};

/* --- 3D-сцена с перетаскиванием --- */
RT.scene=(el,a)=>{
  a.data.objs=a.data.objs||[{t:'cube',x:25,y:35,c:'#5b8cff'},{t:'sphere',x:55,y:55,c:'#22d3ee'},{t:'pyramid',x:42,y:72,c:'#a78bfa'}];
  el.innerHTML=`<div class="rt-head"><h3>🎛️ 3D-сцена</h3><span class="rt-tag">перетаскивай объекты</span></div>
  <div class="stage3d" id="st3"><div class="floor"></div></div>
  <div class="chiprow" style="padding:10px 0 4px">${[['cube','Куб'],['sphere','Шар'],['pyramid','Пирамида'],['cyl','Цилиндр']].map(x=>`<button class="chip" data-add3="${x[0]}">+ ${x[1]}</button>`).join('')}<button class="chip" id="clr3">Очистить</button></div>
  <div class="todo" style="margin-top:8px"><input type="color" class="inp" id="oCol" value="#5b8cff" style="height:38px;padding:2px;flex:0 0 64px" data-tooltip="Цвет выбранного"><button class="btn" id="oDel">Удалить выбранный</button><span style="color:var(--tx2);font-size:11px;align-self:center">тяни объекты мышью, клик — выделить</span></div>`;
  const stage=$('#st3'); let sel=-1;
  const shape=(t,c)=>t==='cube'?`<div class="o3d cubeO" style="background:${c}55;border-color:${c}"></div>`
    :t==='sphere'?`<div class="o3d sphereO" style="background:radial-gradient(circle at 35% 30%, ${c}, ${c}66)"></div>`
    :t==='pyramid'?`<div class="o3d pyrO" style="border-bottom-color:${c}"></div>`
    :`<div class="o3d cylO" style="background:${c}66;border-color:${c}"></div>`;
  const paint=()=>{
    stage.querySelectorAll('.o3dwrap').forEach(x=>x.remove());
    a.data.objs.forEach((o,i)=>{
      const d=document.createElement('div'); d.className='o3dwrap'; d.style.left=o.x+'%'; d.style.bottom=o.y+'%'; d.innerHTML=shape(o.t,o.c);
      if(sel===i)d.firstChild.classList.add('selO');
      d.onpointerdown=e=>{sel=i; const r=stage.getBoundingClientRect(); const ox=e.clientX, oy=e.clientY, obx=o.x, oby=o.y;
        const mv=ev=>{o.x=Math.max(0,Math.min(92,obx+(ev.clientX-ox)/r.width*100)); o.y=Math.max(0,Math.min(85,oby+(oy-ev.clientY)/r.height*100)); d.style.left=o.x+'%'; d.style.bottom=o.y+'%';};
        const up=()=>{stage.removeEventListener('pointermove',mv); save(); paint();};
        stage.addEventListener('pointermove',mv); stage.addEventListener('pointerup',up,{once:true});};
      stage.append(d);});
  };
  el.querySelectorAll('[data-add3]').forEach(b=>b.onclick=()=>{a.data.objs.push({t:b.dataset.add3,x:10+rnd(70),y:15+rnd(55),c:$('#oCol').value}); save(); paint();});
  $('#clr3').onclick=()=>{a.data.objs=[]; sel=-1; save(); paint();};
  $('#oDel').onclick=()=>{if(sel>=0){a.data.objs.splice(sel,1); sel=-1; save(); paint();}};
  $('#oCol').oninput=e=>{if(sel>=0){a.data.objs[sel].c=e.target.value; save(); paint();}};
  paint();
};

function improveApp(id){

  const c=catById(a.cat)||CATS[0];

  if(!a.feats.some(f=>/поиск/i.test(f)))tips.push('Добавь «Поиск» — пользователи находят нужное в два клика.');
  if(!a.mods.length)tips.push('Подключи второй модуль — из шаблона получится твой собственный продукт.');
  if(!a.feats.some(f=>/экспорт|скач/i.test(f)))tips.push('«Экспорт» — кнопка скачивания, данные не запираются в приложении.');

  <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:9px">${MODULES.map(m=>{const on=a.mods.includes(m.rt); const main=m.rt===a.rt;

  <label class="fl">Раздел каталога</label><select class="inp" id="imC" style="width:100%">${CATS.map(x=>`<option value="${x.id}" ${x.id===a.cat?'selected':''}>${x.name}</option>`).join('')}</select>
  <label class="fl">💡 Советы HUB</label>
  ${tips.map(t=>`<div class="entrow" style="padding:7px 11px"><small style="color:var(--tx2)">${t}</small></div>`).join('')}

    if(a.mods.includes(rt))a.mods=a.mods.filter(x=>x!==rt);

  $('#imSave').onclick=()=>{a.name=$('#imN').value.trim()||a.name; a.cat=$('#imC').value; save(); closeModal(); toast('Изменения применены ✔'); render();};

/* ================= ПРЕМИУМ-СЛОЙ: частицы, 3D-наклон, ripple, splash ================= */
const FX={c:null,x:null,p:[]};
function fxInit(){
  const bg=document.createElement('div'); bg.id='bgfx'; bg.innerHTML='<i></i><i></i><i></i>'; document.body.prepend(bg);
  FX.c=document.createElement('canvas'); FX.c.id='fxc'; document.body.prepend(FX.c); FX.x=FX.c.getContext('2d');
  const rs=()=>{FX.c.width=innerWidth; FX.c.height=innerHeight;}; rs(); addEventListener('resize',rs);
  for(let i=0;i<26;i++)FX.p.push({x:Math.random()*innerWidth, y:Math.random()*innerHeight, r:1+Math.random()*2.2, vx:(Math.random()-.5)*.25, vy:-.12-Math.random()*.3, s:Math.random()*6.28});
  let last=0;
  (function loop(t){
    if(t-last>42){ last=t;
      FX.x.clearRect(0,0,FX.c.width,FX.c.height);
      FX.x.fillStyle=document.documentElement.dataset.theme==='light'?'rgba(40,60,110,.28)':'rgba(255,255,255,.45)';
      for(const p of FX.p){
        p.x+=p.vx; p.y+=p.vy; p.s+=.01;
        if(p.y<-10){p.y=FX.c.height+10; p.x=Math.random()*FX.c.width;}
        if(p.x<-10)p.x=FX.c.width+10; if(p.x>FX.c.width+10)p.x=-10;
        FX.x.globalAlpha=.22+.34*Math.abs(Math.sin(p.s));
        FX.x.beginPath(); FX.x.arc(p.x,p.y,p.r,0,6.283); FX.x.fill();
      }
      FX.x.globalAlpha=1;
    }
    if(!document.hidden)requestAnimationFrame(loop); else setTimeout(loop,400);
  })(0);
}
let tiltEl=null, tiltRaf=false, mx=0, my=0;
document.addEventListener('mousemove',e=>{
  mx=e.clientX; my=e.clientY;
  const el=e.target.closest('.cat-card,.tpl-card,.app-card,.pkg');
  if(el!==tiltEl){
    if(tiltEl){tiltEl.classList.remove('tilt3d'); tiltEl.style.removeProperty('--rx'); tiltEl.style.removeProperty('--ry');}
    tiltEl=el; if(tiltEl)tiltEl.classList.add('tilt3d');
  }
  if(tiltEl&&!tiltRaf){ tiltRaf=true; requestAnimationFrame(()=>{ tiltRaf=false; if(!tiltEl)return;
    const r=tiltEl.getBoundingClientRect(), dx=(mx-r.left)/r.width-.5, dy=(my-r.top)/r.height-.5;
    tiltEl.style.setProperty('--ry',(dx*9).toFixed(2)+'deg');
    tiltEl.style.setProperty('--rx',(-dy*7).toFixed(2)+'deg'); }); }
});
document.addEventListener('click',e=>{
  const b=e.target.closest('.btn,.chip,.lpill'); if(!b)return;
  const r=b.getBoundingClientRect(), d=Math.max(r.width,r.height);
  const s=document.createElement('span'); s.className='rip';
  s.style.width=s.style.height=d+'px';
  s.style.left=(e.clientX-r.left-d/2)+'px'; s.style.top=(e.clientY-r.top-d/2)+'px';
  b.append(s); setTimeout(()=>s.remove(),620);
});
function countUp(){
  $$('.stat .v').forEach(el=>{
    const target=parseInt(el.textContent,10); if(!isFinite(target)||target<=0)return;
    const t0=performance.now();
    const iv=setInterval(()=>{ if(!el.isConnected){clearInterval(iv); return;}
      const p=Math.min(1,(performance.now()-t0)/650);
      el.textContent=Math.round(target*(.25+.75*p*p));
      if(p>=1){el.textContent=target; clearInterval(iv);}},28);
  });
}

  d.innerHTML=`<div><div class="sp-cube">${['grid','chat','rocket','music','folder','bot'].map(k=>`<b>${svg(k,32)}</b>`).join('')}</div><div class="sp-t">HUB</div><div class="sp-s">ВСЁ В ОДНОМ</div><div class="sp-bar"><i></i></div></div>`;
  document.body.append(d);
  const off=()=>{d.classList.add('off'); setTimeout(()=>d.remove(),560);};
  setTimeout(off,1750); d.onclick=off;
}
function loginGate(){
  if(S.profile.name)return;
  const d=document.createElement('div'); d.id='login';
  const ROLES=[['user','🙂','Пользователь','всё для себя: игры, обучение, личные приложения'],
   ['staff','🧑‍💼','Сотрудник','рабочий набор: задачи, клиенты, файлы, отчёты'],
   ['admin','🛡️','Админ','полный доступ: метрики, сотрудники, управление']];
  d.innerHTML=`<div class="lg-box"><div class="sp-cube" style="margin:0 auto 18px">${['grid','chat','rocket','music','folder','bot'].map(k=>`<b>${svg(k,26)}</b>`).join('')}</div>
  <div class="sp-t">HUB</div><div class="sp-s">ВСЁ В ОДНОМ · CREATE · TALK · BUILD</div>
  <input class="inp" id="lgName" placeholder="Как тебя звать?" maxlength="20">
  <div class="emgrid">${['🙂','😎','🦊','🐼','🚀','🌟','🧩','🐺'].map(e=>`<button class="em" data-av="${e}">${e}</button>`).join('')}</div>
  <label class="fl" style="margin-top:14px">Кто ты в HUB? — интерфейс подстроится</label>
  <div class="grid" style="grid-template-columns:repeat(3,1fr);gap:8px">${ROLES.map(r=>`<button class="tpl-card lrole${r[0]==='user'?' on':''}" data-role="${r[0]}" style="padding:10px;cursor:pointer"><b style="font-size:20px">${r[1]}</b><small style="display:block;font-weight:700;margin-top:4px">${r[2]}</small><small style="display:block;color:var(--tx2);font-size:10px;line-height:1.4;margin-top:3px">${r[3]}</small></button>`).join('')}</div>
  <div id="lgAdmin" style="display:none;margin-top:10px"><input class="inp" id="lgCode" placeholder="Код доступа админа (демо: 0000)" maxlength="12" style="font-family:ui-monospace,monospace"></div>
  <button class="btn acc" id="lgGo" style="width:100%;margin-top:16px">${svg('rocket',15)} Войти в HUB</button>
  <small style="color:var(--tx2);display:block;margin-top:10px">Демо-режим: профиль хранится локально, без серверов</small></div>`;
  document.body.append(d); trDOM(d);
  let av='🙂', role='user';
  d.querySelectorAll('[data-av]').forEach(b=>b.onclick=()=>{av=b.dataset.av; d.querySelectorAll('[data-av]').forEach(x=>x.classList.toggle('on',x===b));});
  d.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;
    d.querySelectorAll('[data-role]').forEach(x=>x.classList.toggle('on',x===b));
    d.querySelector('#lgAdmin').style.display=role==='admin'?'block':'none';});
  const go=()=>{
    let code='';
    if(role==='admin'){code=d.querySelector('#lgCode')?d.querySelector('#lgCode').value.trim():'';
      if(code!=='0000')return toast('Неверный код доступа. Демо-код: 0000');}
    const n=d.querySelector('#lgName').value.trim()||'Друг'; S.profile={name:n,avatar:av,role,code}; save();
    d.classList.add('off'); setTimeout(()=>d.remove(),600); toast('Добро пожаловать, '+n+' · роль: '+({admin:'админ',staff:'сотрудник',user:'пользователь'})[role]);
    if(!S.tourDone)setTimeout(()=>startTour(0),550);};
  d.querySelector('#lgGo').onclick=go;
  d.querySelector('#lgName').onkeydown=e=>{if(e.key==='Enter')go();};
}

/* ================= ОБУЧАЮЩИЙ ТУР ================= */
function startTour(i=0){
  const mob=()=>window.matchMedia('(max-width:760px)').matches;
  const NAVSEL=k=>mob()?`#mnav [data-nav="${k}"]`:`#side [data-nav="${k}"]`;
  const STEPS=[
   {nav:'chat',sel:NAVSEL('chat'),t:'Чат — главный режим',d:'Спрашивай что угодно или расскажи идею: агент даст план, покажет шаблон и соберёт приложение. Директивы со слэша: /помощь'},
   {nav:'catalog',sel:NAVSEL('catalog'),t:'Каталог — что сделать',d:'16 разделов, 39 шаблонов и реестр «А-Я · A-Z» на 264 приложения. Любое создаётся в один клик — и сразу видно, как выглядит.'},
   mob()?null:{nav:'workshop',sel:NAVSEL('workshop'),t:'Мастерская — студии создания',d:'Музыка, видео, презентации, документы, сайты и песочница кода — всё внутри HUB, ничего устанавливать не нужно.'},
   mob()?null:{nav:'learn',sel:NAVSEL('learn'),t:'Обучение — в трёх форматах',d:'JavaScript, Python, алгоритмы: читай как книгу, проходи как в Duolingo (XP и стрики) или сразу решай задачи.'},
   {nav:'hub',sel:NAVSEL('hub'),t:'Хаб — твоё главное меню',d:'Здесь живут твои приложения: открыть, доработать, упаковать под Android, Windows, Linux, macOS, iOS и Web. Кнопки можно перетаскивать — порядок сохранится.'},
   {nav:'hub',sel:'.qa',t:'Создай что-нибудь',d:'«Создать приложение» — мастер с живым превью. Или возьми шаблон из каталога и доработай его: подключай модули, добавляй функции.'},
   {nav:'chat',sel:'#chatInp',t:'Попробуй прямо сейчас',d:'Напиши: «хочу сделать свой трекер привычек» — и смотри, как идея превращается в приложение. Повторить тур: /тур'}].filter(Boolean);
  i=Math.max(0,Math.min(i,STEPS.length-1));
  const st=STEPS[i];
  const paint=()=>{
    document.querySelectorAll('.tour-hl').forEach(x=>x.classList.remove('tour-hl'));
    const old=$('#tourBox'); if(old)old.remove();
    const el=document.querySelector(st.sel); if(!el){ if(i<STEPS.length-1){startTour(i+1);} return; }
    el.scrollIntoView({block:'center',behavior:'smooth'});
    el.classList.add('tour-hl');
    const b=document.createElement('div'); b.id='tourBox';
    b.innerHTML=`<b>${st.t}</b><p>${st.d}</p><div class="acts" style="margin-top:11px"><button class="btn sm" id="tourSkip">Пропустить</button><span style="flex:1"></span><span style="font-size:11px;color:var(--tx2);align-self:center">${i+1}/${STEPS.length}</span>${i<STEPS.length-1?`<button class="btn acc sm" id="tourNext">Дальше →</button>`:`<button class="btn acc sm" id="tourFin">${svg('check',14)} Готово</button>`}</div>`;
    document.body.append(b);
    const r=el.getBoundingClientRect();
    b.style.left=Math.max(12,Math.min(innerWidth-344,r.left))+'px';
    b.style.top=Math.min(innerHeight-200,r.bottom+12)+'px';
    if($('#tourNext'))$('#tourNext').onclick=()=>startTour(i+1);
    if($('#tourFin'))$('#tourFin').onclick=endTour;
    $('#tourSkip').onclick=endTour;
  };
  if(route!==st.nav&&st.nav){navTo(st.nav); setTimeout(paint,450);} else paint();
}
function endTour(){S.tourDone=true; save(); document.querySelectorAll('.tour-hl').forEach(x=>x.classList.remove('tour-hl')); const b=$('#tourBox'); if(b)b.remove();}

/* ================= СТАРТ ================= */
seedWeek();
applyTheme();
fxInit();
splash();
render();
setTimeout(()=>{ if(!S.profile.name)loginGate(); else if(!S.tourDone)startTour(0); },2300);
/* отладочный доступ из консоли: window.S читает/пишет состояние */
Object.defineProperty(window,'S',{get:()=>S,set:v=>{S=v;}});
</script>
</body>
</html>
