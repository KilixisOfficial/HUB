/* --- химические формулы --- */
RT.chem=(el,a)=>{
  const ELS=[['H','Водород',1.008],['C','Углерод',12.011],['N','Азот',14.007],['O','Кислород',15.999],['Na','Натрий',22.990],['Mg','Магний',24.305],['P','Фосфор',30.974],['S','Сера',32.06],['Cl','Хлор',35.45],['K','Калий',39.098],['Ca','Кальций',40.078],['Fe','Железо',55.845]];
  a.data.formula=a.data.formula||'';
  el.innerHTML=`<div class="rt-head"><h3>⚗️ Химические формулы</h3><span class="rt-tag" id="chTag">молярная масса</span></div>
  <div class="calcdisp" id="chF" style="font-size:24px">${esc(a.data.formula)||'—'}</div>
  <div class="rtgrid" style="grid-template-columns:repeat(auto-fill,minmax(86px,1fr))">${ELS.map(e=>`<button class="linkc" data-el="${e[0]}" data-tooltip="${e[1]} · ${e[2]}"><b style="font-size:15px">${e[0]}</b><small style="color:var(--tx2);font-size:10px">${e[2]}</small></button>`).join('')}</div>
  <div class="chiprow" style="padding:8px 0">${[2,3,4,5,6].map(n=>`<button class="chip" data-sub="${n}">${n}<small style="font-size:9px;vertical-align:sub">ₙ</small></button>`).join('')}<button class="chip" data-sub="(">(</button><button class="chip" data-sub=")">)</button></div>
  <div class="acts" style="margin:10px 0"><button class="btn acc" id="chCalc">⚖️ Посчитать</button><button class="btn" id="chClr">Очистить</button><button class="btn" id="chSave">💾 Сохранить в данные</button></div>
  <div id="chRes"></div>`;
  const paint=()=>{$('#chF').textContent=a.data.formula||'—'; save();};
  el.querySelectorAll('[data-el]').forEach(b=>b.onclick=()=>{a.data.formula+=b.dataset.el; paint();});
  el.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{a.data.formula+=b.dataset.sub; paint();});
  $('#chClr').onclick=()=>{a.data.formula=''; paint(); $('#chRes').innerHTML='';};
  $('#chCalc').onclick=()=>{
    const f=a.data.formula; if(!f)return;
    const counts={}; let stack=[counts]; let cur='';
    const flush=()=>{if(cur){const el=ELS.find(x=>x[0]===cur); if(el)stack[stack.length-1][cur]=(stack[stack.length-1][cur]||0); cur='';}};
    for(let i=0;i<f.length;i++){const ch=f[i];
      if(ch==='('){flush(); stack.push({});}
      else if(ch===')'){flush(); const grp=stack.pop(); let num=''; while(i+1<f.length&&/[0-9]/.test(f[i+1])){num+=f[++i];} const mult=num?+num:1;
        for(const k in grp)stack[stack.length-1][k]=(stack[stack.length-1][k]||0)+grp[k]*mult;}
      else if(/[0-9]/.test(ch)){let num=ch; while(i+1<f.length&&/[0-9]/.test(f[i+1])){num+=f[++i];} const t=stack[stack.length-1]; if(cur){} else {const last=Object.keys(t).pop(); if(last!=null){t[last]+= +num-1;}}}
      else if(/[A-Z]/.test(ch)){flush(); cur=ch;}
      else if(/[a-z]/.test(ch)){cur+=ch;}
    }
    flush();
    let mass=0, parts=[];
    for(const sym in counts){const e=ELS.find(x=>x[0]===sym); if(!e)continue; mass+=e[2]*counts[sym]; parts.push(`${sym}×${counts[sym]}`);}
    $('#chRes').innerHTML=parts.length?`<div class="notecard" style="border-color:var(--acc)"><b>Молярная масса: ${mass.toFixed(2)} г/моль</b><p style="color:var(--tx2);font-size:13px;margin-top:5px">Состав: ${parts.join(' · ')}</p></div>`
      :`<div class="empty" style="padding:14px">Не распознал элементы — используй кнопки выше</div>`;
    $('#chTag').textContent=parts.length?mass.toFixed(1)+' г/моль':'молярная масса';};
  $('#chSave').onclick=()=>{toast('Формула сохранена: '+(a.data.formula||'пусто'));};
  paint();
};

    $('#cD').innerHTML=`<div class="donut" style="background:conic-gradient(${stops})"><i>${sum}</i></div><div class="dleg">${rows.map((r,i)=>`<span><i class="dot" style="background:${PALETTES[i%PALETTES.length][1]}"></i>${esc(r.n)}<b>${r.v}</b></span>`).join('')}</div>`;
    const w=440,h=130, n=rows.length;
    const pts=rows.map((r,i)=>[45+i*(w-70)/Math.max(1,n-1),h-14-(r.v/max*(h-34))]);

    save();
  };

RT.scene=(el,a)=>{

  <div class="stage3d" id="st3"><div class="floor"></div></div>

  <div class="todo" style="margin-top:8px"><input type="color" class="inp" id="oCol" value="#5b8cff" style="height:38px;padding:2px;flex:0 0 64px" data-tooltip="Цвет выбранного"><button class="btn" id="oDel">Удалить выбранный</button><span style="color:var(--tx2);font-size:11px;align-self:center">тяни объекты мышью, клик — выделить</span></div>`;
  const stage=$('#st3'); let sel=-1;
  const shape=(t,c)=>t==='cube'?`<div class="o3d cubeO" style="background:${c}55;border-color:${c}"></div>`
    :t==='sphere'?`<div class="o3d sphereO" style="background:radial-gradient(circle at 35% 30%, ${c}, ${c}66)"></div>`
    :t==='pyramid'?`<div class="o3d pyrO" style="border-bottom-color:${c}"></div>`
    :`<div class="o3d cylO" style="background:${c}66;border-color:${c}"></div>`;
  const paint=()=>{
    stage.querySelectorAll('.o3dwrap').forEach(x=>x.remove());
    a.data.objs.forEach((o,i)=>{
      const d=document.createElement('div'); d.className='o3dwrap'; d.style.left=o.x+'%'; d.style.bottom=o.y+'%'; d.innerHTML=shape(o.t,o.c);
      if(sel===i)d.firstChild.classList.add('selO');
      d.onpointerdown=e=>{sel=i; const r=stage.getBoundingClientRect(); const ox=e.clientX, oy=e.clientY, obx=o.x, oby=o.y;
        const mv=ev=>{o.x=Math.max(0,Math.min(92,obx+(ev.clientX-ox)/r.width*100)); o.y=Math.max(0,Math.min(85,oby+(oy-ev.clientY)/r.height*100)); d.style.left=o.x+'%'; d.style.bottom=o.y+'%';};
        const up=()=>{stage.removeEventListener('pointermove',mv); save(); paint();};
        stage.addEventListener('pointermove',mv); stage.addEventListener('pointerup',up,{once:true});};
      stage.append(d);});
  };
  el.querySelectorAll('[data-add3]').forEach(b=>b.onclick=()=>{a.data.objs.push({t:b.dataset.add3,x:10+rnd(70),y:15+rnd(55),c:$('#oCol').value}); save(); paint();});

  $('#oDel').onclick=()=>{if(sel>=0){a.data.objs.splice(sel,1); sel=-1; save(); paint();}};
  $('#oCol').oninput=e=>{if(sel>=0){a.data.objs[sel].c=e.target.value; save(); paint();}};
  paint();
};

function improveApp(id){

  if(!list.length){toast('Для этого движка шаблоны появятся в следующем обновлении'); return;}
  const WHAT={tasks:'заполнит список дел',notes:'наполнит заметками',table:'создаст колонки и строки',quiz:'добавит вопросы',tracker:'внесёт первые записи',links:'заполнит закладками',music:'соберёт плейлист',video:'соберёт раскадровку',browser:'настроит стартовые страницы',term:'наполнит терминал командами',chem:'подставит формулы',charts:'наполнит данными',scene:'расставит объекты',rocket:'соберёт технику',slides:'соберёт слайды',docs:'создаст текст документа',play:'вставит код-пример'};
  modal(`<h2>${svg('sparkles',20)} Шаблоны — ${esc(a.name)}</h2><div class="msub">${list.length} наборов × 10 стилей оформления = ${list.length*10} вариантов · клик — применить</div>
  <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:9px">${list.map((p,i)=>`<div class="tpl-card" style="padding:11px"><b style="font-size:13px">${esc(p.n)}</b><small style="color:var(--tx2);display:block;margin:5px 0 8px;font-size:11px">${esc(WHAT[a.rt]||'наполнит приложение')}</small><button class="btn sm acc" data-tp="${i}">Применить</button></div>`).join('')}</div>
  <div class="acts" style="margin-top:14px"><button class="btn ghost" onclick="closeModal()">Закрыть</button></div>`);
  $$('#modalBox [data-tp]').forEach(b=>b.onclick=()=>{
    const p=list[+b.dataset.tp];
    if(p.items)a.data.items=p.items.map(x=>({t:x[1]||x[0],d:false}));
    if(p.notes)a.data.notes=p.notes.map(x=>({t:x[0],x:x[1]}));
    if(p.cols){a.data.cols=p.cols; a.data.rows=p.rows.map(r=>r.slice());}
    if(p.qs)a.data.qs=p.qs.map(q=>({...q}));
    if(p.entries){a.data.entries=p.entries.map(e=>({...e})); if(p.unit)a.unit=p.unit;}
    if(p.links)a.data.links=p.links.map(l=>({...l}));
    if(p.seed&&RT.musicSeed){a.data.tracks=RT.musicSeed(p.seed); a.data.cur=0;}
    if(p.scenes)a.data.scenes=p.scenes.map(s=>({...s}));
    if(p.hist)a.data.hist=['hub://старт',...p.hist];
    if(p.log)a.data.log=[...p.log];
    if(p.formula)a.data.formula=p.formula;
    if(p.rows)a.data.rows=p.rows.map(r=>({...r}));
    if(p.objs)a.data.objs=p.objs.map(o=>({...o}));
    if(p.veh){a.data.v=p.veh; a.data.col=p.col; a.data.sz=p.sz||70;}
    if(p.slides)a.data.slides=p.slides.map(s=>({...s})); a.data.cur=0;
    if(p.doc){a.data.title=p.doc[0]; a.data.body=p.doc[1];}
    if(p.code)a.data.code=p.code;
    save(); closeModal(); toast('Шаблон «'+p.n+'» применён'); render();});
}

function palRowHTML(){return `<label class="fl">Стиль оформления — 10 вариаций, меняется всё</label><div class="chiprow" style="flex-wrap:wrap" id="bmPal">${PALETTES.map((p,i)=>`<button class="chip" data-pal="${i}"><i class="dot" style="background:${p[1]}"></i><i class="dot" style="background:${p[2]}"></i> ${p[0]}</button>`).join('')}</div>`;}
function palWire(store){$$('#modalBox [data-pal]').forEach(b=>{b.onclick=()=>{store.index=+b.dataset.pal; $$('#modalBox [data-pal]').forEach(x=>x.style.borderColor=''); b.style.borderColor='var(--acc)';};
  b.onmouseenter=()=>document.documentElement.style.setProperty('--acc',PALETTES[+b.dataset.pal][2]);
  b.onmouseleave=()=>document.documentElement.style.setProperty('--acc',S.settings.accent||'#5b8cff');});}
const palGrad=i=>i>=0?[PALETTES[i][1],PALETTES[i][2]]:null;

/* ================= СБОРКА ПРИЛОЖЕНИЯ ================= */
function buildFromTemplate(tid,customName,catOverride){
  const t=tid?tplById(tid):null;
  const cat=catOverride||(t?t.cat:'apps');
  if(t&&t.rt==='agentmk'){closeModal(); openAgentWizard(); return;}
  const rt=t?t.rt:(APPS_CAT_RT[cat]||'generic');
  const nm=customName||(t?t.name:'Моё приложение');
  modal(`<h2>${svg(RT_ICON[rt]||'package',20)} ${esc(nm)}</h2><div class="msub">Вот оно — ты сразу видишь, что создаёшь. Выбери цвет и смотри, как приложение оживает</div>
  <div id="bmPrev"><div id="bmPrevLive">${mk(rt,catById(cat).grad)}</div></div>
  ${palRowHTML()}
  <div class="prog"><i id="bmP"></i></div><div class="steps" id="bmS"></div>
  <div class="acts" id="bmCancel" style="margin-top:8px"><button class="btn ghost sm" onclick="closeModal()">Отмена</button><span style="flex:1"></span></div>
  <div class="acts" id="bmDone" style="display:none">
  <button class="btn acc" id="bmOpen">🚀 Открыть приложение</button><button class="btn" id="bmHub">🏠 В Хаб</button></div>`);
  const pstate={index:-1}; palWire(pstate);
  const steps=['📋 Планирование','🎨 Интерфейс','⚙️ Логика','🗄️ База данных','📦 Сборка'];
  let i=0;
  const tick=()=>{
    if(!$('#modals').classList.contains('on'))return;
    if(i<steps.length){$('#bmS').innerHTML=steps.map((s,j)=>`<div class="step ${j<=i?'done':''}"><span class="sic">${j<i?'✔':j===i?'⏳':'·'}</span>${s}</div>`).join('');
      $('#bmP').style.width=((i+1)/steps.length*100)+'%'; i++; setTimeout(tick,380);}
    else{
      $('#bmS').innerHTML=steps.map(s=>`<div class="step done"><span class="sic">✔</span>${s}</div>`).join('');
      const c=catById(cat);
      const app={id:uid(),name:uname(nm),icon:t?t.icon:'📦',cat,tpl:t?t.id:null,rt,feats:(t?t.feats.slice():[...(CAT_FEATS[cat]||['Главное меню','Настройки'])]),created:Date.now(),data:{},grad:palGrad(pstate.index)};
      if(rt==='music')app.data.tracks=RT.musicSeed(t?t.seed:'tracks');
      if(rt==='table'&&t&&t.seed)app.data={cols:t.seed.cols.slice(),rows:t.seed.rows.map(r=>r.slice())};
      if(rt==='table'&&(!t||!t.seed))app.data={cols:['Название','Значение'],rows:[['Пример','отредактируй меня']]};
      if(rt==='notes'&&t&&t.seed)app.seedNotes=t.seed;
      if(rt==='tracker')app.unit=(t&&t.unit)||'записей';
      S.apps.unshift(app); bump(cat); save();
      /* живое превью: настоящий рантайм прямо в модале */
      try{const lv=$('#bmPrevLive'); lv.innerHTML=''; const pel=document.createElement('div'); lv.append(pel);
        (RT[app.rt]||RT.generic)(pel,app);
        pel.querySelectorAll('.rt-head h3').forEach(h=>{const txt=h.textContent.trim(); const first=txt.split(/\s+/)[0];
          if(EMOJI2SVG[first])h.innerHTML=svg(EMOJI2SVG[first],17)+' '+esc(txt.slice(first.length).trim());});
        trDOM(pel);
      }catch(e){}
      $('#bmCancel').style.display='none'; $('#bmDone').style.display='flex'; toast('Готово! «'+app.name+'» в Хабе 🎉');
      $('#bmOpen').onclick=()=>{closeModal(); navTo('app:'+app.id);};
      $('#bmHub').onclick=()=>{closeModal(); navTo('hub');};
    }};
  tick();
}

function openAppWizard(presetCat){
  const st={step:0,name:'',desc:'',cat:(presetCat&&catById(presetCat))?presetCat:'apps',feats:[],icon:'🚀',color:0,grad:null,mods:['tasks']};
  const colors=PALETTES.map(p=>[p[1],p[2]]);

  <div class="acts" style="margin-top:18px"><button class="btn ghost" onclick="closeModal()">Отмена</button><span style="flex:1"></span><button class="btn" id="wzBack">← Назад</button><button class="btn acc" id="wzNext">Дальше →</button></div>`);
  const paint=()=>{
    $('#wzSub').textContent=`Шаг ${st.step+1} из 4`;
    $('#wzBack').style.visibility=st.step?'visible':'hidden';
    $('#wzNext').textContent=st.step===3?'⚡ Собрать приложение':'Дальше →';
    const B=$('#wzBody');
    if(st.step===0)B.innerHTML=`<label class="fl">Название</label><input class="inp" id="wzName" value="${esc(st.name)}" placeholder="Например: Мой трекер привычек">
      <label class="fl">Опиши идею — что должно получиться?</label><textarea class="inp" id="wzDesc" rows="3" placeholder="Например: приложение, где я отмечаю привычки и вижу прогресс за неделю…">${esc(st.desc)}</textarea>`;
    if(st.step===1)B.innerHTML=`<label class="fl">Раздел — что ближе к идее?</label><div class="rtgrid">${CATS.filter(c=>c.id!=='style').map(c=>`<button class="em" style="width:auto;height:auto;padding:10px 8px;display:flex;flex-direction:column;gap:4px;align-items:center;${st.cat===c.id?'border-color:var(--acc);background:rgba(91,140,255,.15)':''}" data-c="${c.id}">${svg(c.si,24)}<small style="font-size:11px">${c.name}</small></button>`).join('')}</div>
      <label class="fl" style="margin-top:14px">Что внутри? — отмечай модули, каждое станет вкладкой</label>
      <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px">${MODULES.map(m=>`<label class="check" style="background:var(--card2);border:1px solid ${st.mods.includes(m.rt)?'var(--acc)':'var(--line)'};border-radius:12px;padding:8px 10px"><input type="checkbox" data-wm="${m.rt}" ${st.mods.includes(m.rt)?'checked':''}> ${svg(RT_ICON[m.rt]||'package',14)} ${m.name}</label>`).join('')}
      <label class="check" style="background:var(--card2);border:1px solid ${st.mods.includes('admin')?'var(--acc)':'var(--line)'};border-radius:12px;padding:8px 10px"><input type="checkbox" data-wm="admin" ${st.mods.includes('admin')?'checked':''}> ${svg('shield',14)} Админ-панель</label></div>`;
    if(st.step===1)$$('#wzBody input[data-wm]').forEach(c=>c.onchange=()=>{const rt=c.dataset.wm; if(c.checked){if(!st.mods.includes(rt))st.mods.push(rt);} else st.mods=st.mods.filter(x=>x!==rt);});
    if(st.step===2){if(!st.feats.length)st.feats=[...(CAT_FEATS[st.cat]||['Главное меню','Настройки'])];
      B.innerHTML=`<label class="fl">Возможности приложения (отметь нужные)</label>
      ${[...(CAT_FEATS[st.cat]||[]),'Главное меню','Статистика','Тёмная тема'].map(f=>`<label class="check"><input type="checkbox" ${st.feats.includes(f)?'checked':''} data-f="${esc(f)}"> ${f}</label>`).join('')}`;}
    if(st.step===3)B.innerHTML=`<label class="fl">Превью — так приложение будет выглядеть в Хабе</label>
      <div id="bmPrev" style="margin-bottom:14px">${mk(APPS_CAT_RT[st.cat]||'generic',st.grad||colors[st.color])}</div>
      <label class="fl">Иконка</label><div class="emgrid">${['🚀','🎵','📊','🕹️','🛠️','💼','🌱','📦','🧠','⭐','🎬','🍳'].map(e=>`<button class="em ${st.icon===e?'on':''}" data-e="${e}">${e}</button>`).join('')}</div>

    if(st.step===0){$('#wzName').oninput=e=>st.name=e.target.value; $('#wzDesc').oninput=e=>st.desc=e.target.value;}
    if(st.step===1)$$('#wzBody .em[data-c]').forEach(b=>b.onclick=()=>{st.cat=b.dataset.c; st.feats=[]; paint();});
    if(st.step===2)$$('#wzBody input[data-f]').forEach(c=>c.onchange=()=>{const f=c.dataset.f; if(c.checked)st.feats.push(f); else st.feats=st.feats.filter(x=>x!==f);});

      $$('#wzBody .sw[data-cl]').forEach(s=>{s.onclick=()=>{st.color=+s.dataset.cl; st.grad=colors[st.color]; paint();};

    const steps=['📋 План','🎨 Дизайн','⚙️ Модули','🗄️ База','📦 Сборка']; let i=0;
    const tick=()=>{ if(!$('#modals').classList.contains('on'))return; if(i<steps.length){$('#bmS').innerHTML=steps.map((s,j)=>`<div class="step ${j<=i?'done':''}"><span class="sic">${j<i?'✔':j===i?'⏳':'·'}</span>${s}</div>`).join(''); $('#bmP').style.width=((i+1)/steps.length*100)+'%'; i++; setTimeout(tick,360);}
      else{$('#bmS').innerHTML=steps.map(s=>`<div class="step done"><span class="sic">✔</span>${s}</div>`).join('');
        const app={id:uid(),name:uname(st.name.trim()),icon:st.icon,cat:st.cat,tpl:null,rt:APPS_CAT_RT[st.cat]||'generic',feats:st.feats.length?st.feats:['Главное меню','Настройки'],created:Date.now(),data:{},grad:st.grad||null,mods:st.mods.filter(m=>m!==APPS_CAT_RT[st.cat])};
        app.mods.forEach(m=>initMod(app,m));
        if(st.cat==='sport')app.unit='подходов';
        if(app.rt==='music')app.data.tracks=RT.musicSeed('tracks');
        if(app.rt==='table')app.data={cols:['Название','Значение'],rows:[['Пример','отредактируй меня']]};
        S.apps.unshift(app); bump(st.cat); save(); toast('Приложение собрано! 🎉');
        $('#bmDone').style.display='flex';
        $('#bmOpen').onclick=()=>{closeModal(); navTo('app:'+app.id);};
        $('#bmHub').onclick=()=>{closeModal(); navTo('hub');};}};
    tick();
  };
  $('#wzBack').onclick=()=>{if(st.step){st.step--; paint();}};
  paint();
}

  <div class="panel" style="margin-bottom:14px"><h3>Язык / Language / 语言</h3><div class="qa" style="margin:0">
    ${[['ru','Русский'],['en','English'],['cn','中文']].map(([v,n])=>`<button class="btn ${S.settings.lang===v?'acc':''}" data-lang="${v}">${n}</button>`).join('')}</div></div>
  <div class="panel" style="margin-bottom:14px"><h3>Тема</h3><div class="qa" style="margin:0">
    ${[['dark','Тёмная'],['light','Светлая']].map(([v,n])=>`<button class="btn ${S.settings.theme===v?'acc':''}" data-theme-set="${v}">${svg(v==='dark'?'moon':'sun',15)} ${n}</button>`).join('')}</div></div>
  <div class="panel" style="margin-bottom:14px"><h3>🎨 Акцентный цвет</h3><div class="emgrid">
    ${ACCENTS.map(c=>`<span class="sw ${S.settings.accent===c?'on':''}" style="background:${c}" data-acc="${c}"></span>`).join('')}</div></div>

    ${CATS.map(c=>`<label class="check"><input type="checkbox" data-fav="${c.id}" ${S.favs&&S.favs.includes(c.id)?'checked':''}> ${svg(c.si,15)} ${c.name}</label>`).join('')}</div>

    <button class="btn sm" id="stVset" style="margin-top:6px">🎚️ Настройки голоса</button></div>

    <button class="btn danger" id="stReset">Сбросить демо-данные</button></div>`;
}
function afterStyle(){
  $$('[data-theme-set]').forEach(b=>b.onclick=()=>{S.settings.theme=b.dataset.themeSet; applyTheme(); save(); render();});
  $$('[data-acc]').forEach(s=>s.onclick=()=>{S.settings.accent=s.dataset.acc; applyTheme(); save(); render();});
  const styPaint=()=>{const q=($('#styQ').value||'').toLowerCase();
    const all=stylePresets().map((p,i)=>({p,i})).filter(({p})=>p.name.toLowerCase().includes(q));
    $('#styChips').innerHTML=all.slice(0,styLimit).map(({p,i})=>`<button class="stychip" data-si="${i}" data-tooltip="${p.name}"><i style="background:${p.bg}"></i><i style="background:${p.accent}"></i>${p.name}</button>`).join('');
    const more=$('#styMore'); if(more)more.style.display=all.length>styLimit?'':'none';
    $$('#styChips [data-si]').forEach(b=>{const p=stylePresets()[+b.dataset.si];
      b.onclick=()=>{applyStylePreset(p); toast('Стиль: '+p.name);};
      b.onmouseenter=()=>previewStyle(p);
      b.onmouseleave=()=>previewStyle(null);});};
  window.__styPaint=styPaint; styPaint();
  const q=$('#styQ'); if(q)q.oninput=()=>{styLimit=48; styPaint();};
  const more=$('#styMore'); if(more)more.onclick=()=>{styLimit+=240; styPaint();};
  $$('[data-si]').forEach(b=>b.onclick=()=>{const p=stylePresets()[+b.dataset.si]; applyStylePreset(p); toast('Стиль: '+p.name);});
  const cA=$('#cuA'); if(cA)cA.oninput=e=>{S.settings.accent=e.target.value; applyTheme(); save();};
  const cB=$('#cuB'); if(cB)cB.oninput=e=>{S.settings.bg=e.target.value; S.settings.bg2=e.target.value; applyTheme(); save();};
  const cR=$('#cuR'); if(cR)cR.oninput=e=>{S.settings.rad=+e.target.value; $('#cuRv').textContent=e.target.value; applyTheme(); save();};
  const cRe=$('#cuReset'); if(cRe)cRe.onclick=()=>{S.settings.bg=''; S.settings.bg2=''; S.settings.rad=0; S.settings.accent='#5b8cff'; applyTheme(); save(); render();};
  const pN=$('#pfName'); if(pN)pN.oninput=e=>{S.profile.name=e.target.value.trim(); save();};
  const pA=$('#pfAv'); if(pA)pA.oninput=e=>{S.profile.avatar=e.target.value.trim(); save();};
  $$('[data-hub]').forEach(c=>c.onchange=()=>{S.hub[c.dataset.hub]=c.checked?1:0; save(); toast('Хаб обновится при следующем входе');});
  $$('[data-lang]').forEach(b=>b.onclick=()=>{S.settings.lang=b.dataset.lang; save(); applyI18n(); render(); toast(S.settings.lang==='ru'?'Язык: русский':S.settings.lang==='en'?'Language: English':'语言：中文');});  $$('[data-fav]').forEach(c=>c.onchange=()=>{const id=c.dataset.fav; S.favs=S.favs||[];
    if(c.checked){if(!S.favs.includes(id))S.favs.push(id);} else S.favs=S.favs.filter(x=>x!==id); save();});
  const vs=$('#stVset'); if(vs)vs.onclick=voiceSettings;
  const t=$('#stTts'); if(t)t.onchange=()=>{S.settings.tts=t.checked; save();};
  const r=$('#stReset'); if(r)r.onclick=()=>{if(confirm('Сбросить все данные демо?')){localStorage.removeItem('hub_v1'); S=DEFAULTS(); S.curAgent=''; applyTheme(); toast('Демо сброшено'); navTo('chat');}};
}
function applyTheme(){
  document.documentElement.dataset.theme=S.settings.theme||'dark';
  const r=document.documentElement.style;
  r.setProperty('--acc',S.settings.accent||'#5b8cff');
  if(S.settings.bg){r.setProperty('--bg',S.settings.bg); r.setProperty('--bg2',S.settings.bg2||S.settings.bg);}
  else{r.removeProperty('--bg'); r.removeProperty('--bg2');}
  if(S.settings.rad)r.setProperty('--r',S.settings.rad+'px'); else r.removeProperty('--r');
  const tb=$('#themeBtn'); if(tb)tb.innerHTML=svg(S.settings.theme==='dark'?'moon':'sun',16);
  const sb2=$('#searchBtn'); if(sb2)sb2.innerHTML=svg('search',16);
  const vb=$('#voiceBtn'); if(vb)vb.innerHTML=svg('volume',16);
  applyI18n();
}

/* ================= СЛУШАТЕЛИ ================= */
$('#searchBtn').onclick=()=>openSearch();
$('#themeBtn').onclick=()=>{S.settings.theme=S.settings.theme==='dark'?'light':'dark'; S.settings.bg=''; S.settings.bg2=''; applyTheme(); save();};

$('#resetBtn').onclick=()=>{if(confirm('Сбросить все данные демо?')){try{localStorage.removeItem('hub_v1');}catch(e){} S=DEFAULTS(); S.curAgent=''; applyTheme(); toast('Демо сброшено'); navTo('chat');}};

/* ================= ПРЕМИУМ-СЛОЙ: частицы, 3D-наклон, ripple, splash ================= */
const FX={c:null,x:null,p:[]};
function fxInit(){
  const bg=document.createElement('div'); bg.id='bgfx'; bg.innerHTML='<i></i><i></i><i></i>'; document.body.prepend(bg);
  FX.c=document.createElement('canvas'); FX.c.id='fxc'; document.body.prepend(FX.c); FX.x=FX.c.getContext('2d');
  const rs=()=>{FX.c.width=innerWidth; FX.c.height=innerHeight;}; rs(); addEventListener('resize',rs);
  for(let i=0;i<26;i++)FX.p.push({x:Math.random()*innerWidth, y:Math.random()*innerHeight, r:1+Math.random()*2.2, vx:(Math.random()-.5)*.25, vy:-.12-Math.random()*.3, s:Math.random()*6.28});
  let last=0;
  (function loop(t){
    if(t-last>42){ last=t;
      FX.x.clearRect(0,0,FX.c.width,FX.c.height);
      FX.x.fillStyle=document.documentElement.dataset.theme==='light'?'rgba(40,60,110,.28)':'rgba(255,255,255,.45)';
      for(const p of FX.p){
        p.x+=p.vx; p.y+=p.vy; p.s+=.01;
        if(p.y<-10){p.y=FX.c.height+10; p.x=Math.random()*FX.c.width;}
        if(p.x<-10)p.x=FX.c.width+10; if(p.x>FX.c.width+10)p.x=-10;
        FX.x.globalAlpha=.22+.34*Math.abs(Math.sin(p.s));
        FX.x.beginPath(); FX.x.arc(p.x,p.y,p.r,0,6.283); FX.x.fill();
      }
      FX.x.globalAlpha=1;
    }
    if(!document.hidden)requestAnimationFrame(loop); else setTimeout(loop,400);
  })(0);
}
let tiltEl=null, tiltRaf=false, mx=0, my=0;
document.addEventListener('mousemove',e=>{
  mx=e.clientX; my=e.clientY;
  const el=e.target.closest('.cat-card,.tpl-card,.app-card,.pkg');
  if(el!==tiltEl){
    if(tiltEl){tiltEl.classList.remove('tilt3d'); tiltEl.style.removeProperty('--rx'); tiltEl.style.removeProperty('--ry');}
    tiltEl=el; if(tiltEl)tiltEl.classList.add('tilt3d');
  }
  if(tiltEl&&!tiltRaf){ tiltRaf=true; requestAnimationFrame(()=>{ tiltRaf=false; if(!tiltEl)return;
    const r=tiltEl.getBoundingClientRect(), dx=(mx-r.left)/r.width-.5, dy=(my-r.top)/r.height-.5;
    tiltEl.style.setProperty('--ry',(dx*9).toFixed(2)+'deg');
    tiltEl.style.setProperty('--rx',(-dy*7).toFixed(2)+'deg'); }); }
});
document.addEventListener('click',e=>{
  const b=e.target.closest('.btn,.chip,.lpill'); if(!b)return;
  const r=b.getBoundingClientRect(), d=Math.max(r.width,r.height);
  const s=document.createElement('span'); s.className='rip';
  s.style.width=s.style.height=d+'px';
  s.style.left=(e.clientX-r.left-d/2)+'px'; s.style.top=(e.clientY-r.top-d/2)+'px';
  b.append(s); setTimeout(()=>s.remove(),620);
});
function countUp(){
  $$('.stat .v').forEach(el=>{
    const target=parseInt(el.textContent,10); if(!isFinite(target)||target<=0)return;
    const t0=performance.now();
    const iv=setInterval(()=>{ if(!el.isConnected){clearInterval(iv); return;}
      const p=Math.min(1,(performance.now()-t0)/650);
      el.textContent=Math.round(target*(.25+.75*p*p));
      if(p>=1){el.textContent=target; clearInterval(iv);}},28);
  });
}
function splash(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const d=document.createElement('div'); d.id='splash';
  d.innerHTML=`<div><div class="sp-cube">${['grid','chat','rocket','music','folder','bot'].map(k=>`<b>${svg(k,32)}</b>`).join('')}</div><div class="sp-t">HUB</div><div class="sp-s">ВСЁ В ОДНОМ</div><div class="sp-bar"><i></i></div></div>`;
  document.body.append(d);
  const off=()=>{d.classList.add('off'); setTimeout(()=>d.remove(),560);};
  setTimeout(off,1750); d.onclick=off;
}
function loginGate(){
  if(S.profile.name)return;
  const d=document.createElement('div'); d.id='login';
  const ROLES=[['user','🙂','Пользователь','всё для себя: игры, обучение, личные приложения'],
   ['staff','🧑‍💼','Сотрудник','рабочий набор: задачи, клиенты, файлы, отчёты'],
   ['admin','🛡️','Админ','полный доступ: метрики, сотрудники, управление']];
  d.innerHTML=`<div class="lg-box"><div class="sp-cube" style="margin:0 auto 18px">${['grid','chat','rocket','music','folder','bot'].map(k=>`<b>${svg(k,26)}</b>`).join('')}</div>
  <div class="sp-t">HUB</div><div class="sp-s">ВСЁ В ОДНОМ · CREATE · TALK · BUILD</div>
  <input class="inp" id="lgName" placeholder="Как тебя звать?" maxlength="20">
  <div class="emgrid">${['🙂','😎','🦊','🐼','🚀','🌟','🧩','🐺'].map(e=>`<button class="em" data-av="${e}">${e}</button>`).join('')}</div>
  <label class="fl" style="margin-top:14px">Кто ты в HUB? — интерфейс подстроится</label>
  <div class="grid" style="grid-template-columns:repeat(3,1fr);gap:8px">${ROLES.map(r=>`<button class="tpl-card lrole${r[0]==='user'?' on':''}" data-role="${r[0]}" style="padding:10px;cursor:pointer"><b style="font-size:20px">${r[1]}</b><small style="display:block;font-weight:700;margin-top:4px">${r[2]}</small><small style="display:block;color:var(--tx2);font-size:10px;line-height:1.4;margin-top:3px">${r[3]}</small></button>`).join('')}</div>
  <div id="lgAdmin" style="display:none;margin-top:10px"><input class="inp" id="lgCode" placeholder="Код доступа админа (демо: 0000)" maxlength="12" style="font-family:ui-monospace,monospace"></div>
  <button class="btn acc" id="lgGo" style="width:100%;margin-top:16px">${svg('rocket',15)} Войти в HUB</button>
  <small style="color:var(--tx2);display:block;margin-top:10px">Демо-режим: профиль хранится локально, без серверов</small></div>`;
  document.body.append(d); trDOM(d);
  let av='🙂', role='user';
  d.querySelectorAll('[data-av]').forEach(b=>b.onclick=()=>{av=b.dataset.av; d.querySelectorAll('[data-av]').forEach(x=>x.classList.toggle('on',x===b));});
  d.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;
    d.querySelectorAll('[data-role]').forEach(x=>x.classList.toggle('on',x===b));
    d.querySelector('#lgAdmin').style.display=role==='admin'?'block':'none';});
  const go=()=>{
    let code='';
    if(role==='admin'){code=d.querySelector('#lgCode')?d.querySelector('#lgCode').value.trim():'';
      if(code!=='0000')return toast('Неверный код доступа. Демо-код: 0000');}
    const n=d.querySelector('#lgName').value.trim()||'Друг'; S.profile={name:n,avatar:av,role,code}; save();
    d.classList.add('off'); setTimeout(()=>d.remove(),600); toast('Добро пожаловать, '+n+' · роль: '+({admin:'админ',staff:'сотрудник',user:'пользователь'})[role]);
    if(!S.tourDone)setTimeout(()=>startTour(0),550);};
  d.querySelector('#lgGo').onclick=go;
  d.querySelector('#lgName').onkeydown=e=>{if(e.key==='Enter')go();};
}

/* ================= ОБУЧАЮЩИЙ ТУР ================= */
function startTour(i=0){
  const mob=()=>window.matchMedia('(max-width:760px)').matches;
  const NAVSEL=k=>mob()?`#mnav [data-nav="${k}"]`:`#side [data-nav="${k}"]`;
  const STEPS=[
   {nav:'chat',sel:NAVSEL('chat'),t:'Чат — главный режим',d:'Спрашивай что угодно или расскажи идею: агент даст план, покажет шаблон и соберёт приложение. Директивы со слэша: /помощь'},
   {nav:'catalog',sel:NAVSEL('catalog'),t:'Каталог — что сделать',d:'16 разделов, 39 шаблонов и реестр «А-Я · A-Z» на 264 приложения. Любое создаётся в один клик — и сразу видно, как выглядит.'},
   mob()?null:{nav:'workshop',sel:NAVSEL('workshop'),t:'Мастерская — студии создания',d:'Музыка, видео, презентации, документы, сайты и песочница кода — всё внутри HUB, ничего устанавливать не нужно.'},
   mob()?null:{nav:'learn',sel:NAVSEL('learn'),t:'Обучение — в трёх форматах',d:'JavaScript, Python, алгоритмы: читай как книгу, проходи как в Duolingo (XP и стрики) или сразу решай задачи.'},
   {nav:'hub',sel:NAVSEL('hub'),t:'Хаб — твоё главное меню',d:'Здесь живут твои приложения: открыть, доработать, упаковать под Android, Windows, Linux, macOS, iOS и Web. Кнопки можно перетаскивать — порядок сохранится.'},
   {nav:'hub',sel:'.qa',t:'Создай что-нибудь',d:'«Создать приложение» — мастер с живым превью. Или возьми шаблон из каталога и доработай его: подключай модули, добавляй функции.'},
   {nav:'chat',sel:'#chatInp',t:'Попробуй прямо сейчас',d:'Напиши: «хочу сделать свой трекер привычек» — и смотри, как идея превращается в приложение. Повторить тур: /тур'}].filter(Boolean);
  i=Math.max(0,Math.min(i,STEPS.length-1));
  const st=STEPS[i];
  const paint=()=>{
    document.querySelectorAll('.tour-hl').forEach(x=>x.classList.remove('tour-hl'));
    const old=$('#tourBox'); if(old)old.remove();
    const el=document.querySelector(st.sel); if(!el){ if(i<STEPS.length-1){startTour(i+1);} return; }
    el.scrollIntoView({block:'center',behavior:'smooth'});
    el.classList.add('tour-hl');
    const b=document.createElement('div'); b.id='tourBox';
    b.innerHTML=`<b>${st.t}</b><p>${st.d}</p><div class="acts" style="margin-top:11px"><button class="btn sm" id="tourSkip">Пропустить</button><span style="flex:1"></span><span style="font-size:11px;color:var(--tx2);align-self:center">${i+1}/${STEPS.length}</span>${i<STEPS.length-1?`<button class="btn acc sm" id="tourNext">Дальше →</button>`:`<button class="btn acc sm" id="tourFin">${svg('check',14)} Готово</button>`}</div>`;
    document.body.append(b);
    const r=el.getBoundingClientRect();
    b.style.left=Math.max(12,Math.min(innerWidth-344,r.left))+'px';
    b.style.top=Math.min(innerHeight-200,r.bottom+12)+'px';
    if($('#tourNext'))$('#tourNext').onclick=()=>startTour(i+1);
    if($('#tourFin'))$('#tourFin').onclick=endTour;
    $('#tourSkip').onclick=endTour;
  };
  if(route!==st.nav&&st.nav){navTo(st.nav); setTimeout(paint,450);} else paint();
}
function endTour(){S.tourDone=true; save(); document.querySelectorAll('.tour-hl').forEach(x=>x.classList.remove('tour-hl')); const b=$('#tourBox'); if(b)b.remove();}

/* ================= СТАРТ ================= */
seedWeek();
applyTheme();
fxInit();
splash();
render();
setTimeout(()=>{ if(!S.profile.name)loginGate(); else if(!S.tourDone)startTour(0); },2300);
</script>
